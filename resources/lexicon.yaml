discourse:
  fillers:
    en: ["Actually,", "See,", "Umm,", "You know,", "So basically,"]
    kn: ["ಅಂದ್ರೆ,", "ನೋಡಿ,", "ಏನಾಯ್ತು ಅಂದ್ರೆ,", "ಅದು,"]
    kn-en_mixed: ["ಅಂದ್ರೆ,", "Actually,", "ನೋಡಿ,", "Basically,"]
    kn-en_latn: ["Andre,", "Nodi,", "Enaaytu andre,", "Actually,"]
    hi: ["देखिए,", "मतलब,", "असल में,", "वो क्या है कि,"]
    hi-en_latn: ["Dekhiye,", "Matlab,", "Actually,", "Woh kya hai na,"]
  emotion:
    en: ["I am really scared.", "I don't know what to do.", "I am very tense about all this.", "Please help me."]
    kn: ["ನನಗೆ ತುಂಬಾ ಭಯ ಆಗ್ತಿದೆ.", "ಏನ್ ಮಾಡ್ಬೇಕು ಅಂತ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.", "ತುಂಬಾ ಟೆನ್ಷನ್ ಆಗಿದೆ.", "ದಯವಿಟ್ಟು ಸಹಾಯ ಮಾಡಿ."]
    kn-en_mixed: ["ನನಗೆ ತುಂಬಾ tension ಆಗಿದೆ.", "ಏನ್ ಮಾಡ್ಬೇಕು ಅಂತ ಗೊತ್ತಾಗ್ತಿಲ್ಲ.", "Please help ಮಾಡಿ.", "ತುಂಬಾ scared ಆಗಿದೀನಿ."]
    kn-en_latn: ["Nange tumba bhaya aagtide.", "En maadbeku antha gottaagtilla.", "Tumba tension aagide.", "Please help maadi."]
    hi: ["मुझे बहुत डर लग रहा है।", "समझ नहीं आ रहा क्या करूँ।", "बहुत टेंशन हो रही है।", "कृपया मेरी मदद कीजिए।"]
    hi-en_latn: ["Mujhe bahut darr lag raha hai.", "Samajh nahi aa raha kya karun.", "Bahut tension ho rahi hai.", "Please meri help kijiye."]
  hedges:   # position: pre = before the clause, post = before final punctuation
    en: [{pre: "I think "}, {pre: "Maybe "}, {pre: "I'm not fully sure, but "}]
    kn: [{post: " ಅನ್ಸುತ್ತೆ"}, {pre: "ಬಹುಶಃ "}]
    kn-en_mixed: [{pre: "Maybe "}, {post: " ಅನ್ಸುತ್ತೆ"}]
    kn-en_latn: [{post: " anstide"}, {pre: "Maybe "}]
    hi: [{pre: "मुझे लगता है "}, {pre: "शायद "}]
    hi-en_latn: [{pre: "Mujhe lagta hai "}, {pre: "Shayad "}]
  flashback:   # introduces an earlier event out of order
    en: ["Oh, I forgot to say, before all this,", "Actually, earlier,"]
    kn: ["ಹೇಳೋದು ಮರೆತೆ, ಇದಕ್ಕಿಂತ ಮುಂಚೆ,", "ಅದಕ್ಕೂ ಮುಂಚೆ,"]
    kn-en_mixed: ["ಹೇಳೋದು ಮರೆತೆ, ಇದಕ್ಕಿಂತ ಮುಂಚೆ,", "Actually ಅದಕ್ಕೂ ಮುಂಚೆ,"]
    kn-en_latn: ["Heldu marete, idakkinta munche,", "Adakku munche,"]
    hi: ["बताना भूल गई, इससे पहले,", "असल में उससे पहले,"]
    hi-en_latn: ["Batana bhool gayi, isse pehle,", "Actually usse pehle,"]
    hi_m: ["बताना भूल गया, इससे पहले,", "असल में उससे पहले,"]
    hi-en_latn_m: ["Batana bhool gaya, isse pehle,", "Actually usse pehle,"]
  closers:
    en: ["What should I do now?", "Can I do anything about this?", "What are my options?"]
    kn: ["ಈಗ ನಾನು ಏನು ಮಾಡಬೇಕು?", "ಇದಕ್ಕೆ ಏನಾದ್ರೂ ದಾರಿ ಇದೆಯಾ?"]
    kn-en_mixed: ["ಈಗ ನಾನು ಏನು ಮಾಡಬೇಕು?", "ಇದಕ್ಕೆ ಏನಾದ್ರೂ solution ಇದೆಯಾ?"]
    kn-en_latn: ["Eega naanu enu maadbeku?", "Idakke enaadru daari ideya?"]
    hi: ["अब मुझे क्या करना चाहिए?", "क्या इसका कोई रास्ता है?"]
    hi-en_latn: ["Ab mujhe kya karna chahiye?", "Iska koi solution hai kya?"]

dialogue:
  dont_know:
    en: ["I [don't](NEG) know.", "I'm [not](NEG) sure about that.", "Sorry, I have [no](NEG) idea."]
    kn: ["[ಗೊತ್ತಿಲ್ಲ](NEG).", "ಅದು ನನಗೆ ಸರಿಯಾಗಿ [ಗೊತ್ತಿಲ್ಲ](NEG)."]
    kn-en_mixed: ["[ಗೊತ್ತಿಲ್ಲ](NEG).", "ಅದು ನನಗೆ sure [ಇಲ್ಲ](NEG)."]
    kn-en_latn: ["[Gottilla](NEG).", "Adu nange sariyaagi [gottilla](NEG)."]
    hi: ["पता [नहीं](NEG)।", "मुझे इसके बारे में ठीक से [नहीं](NEG) पता।"]
    hi-en_latn: ["Pata [nahi](NEG).", "Mujhe iske baare mein sure [nahi](NEG) hai."]
  reexplain:
    en: ["Sorry, I did [not](NEG) understand. Can you ask that again simply?", "What do you mean by that?"]
    kn: ["ಕ್ಷಮಿಸಿ, ಅರ್ಥ [ಆಗ್ಲಿಲ್ಲ](NEG). ಇನ್ನೊಂದ್ಸಲ ಸುಲಭವಾಗಿ ಕೇಳ್ತೀರಾ?", "ಅಂದ್ರೆ ಏನು?"]
    kn-en_mixed: ["Sorry, ಅರ್ಥ [ಆಗ್ಲಿಲ್ಲ](NEG). ಇನ್ನೊಂದ್ಸಲ simple ಆಗಿ ಕೇಳ್ತೀರಾ?", "ಅಂದ್ರೆ ಏನು?"]
    kn-en_latn: ["Sorry, artha [aaglilla](NEG). Innondsala simple aagi keltira?", "Andre enu?"]
    hi: ["माफ़ कीजिए, समझ [नहीं](NEG) आया। फिर से आसान भाषा में पूछेंगे?", "मतलब क्या?"]
    hi-en_latn: ["Sorry, samajh [nahi](NEG) aaya. Phir se simple mein poochenge?", "Matlab kya?"]
  correction:
    en: ["Sorry, I said that wrong.", "[No](NEG) wait, let me correct that."]
    kn: ["ಕ್ಷಮಿಸಿ, ತಪ್ಪಾಗಿ ಹೇಳ್ದೆ.", "[ಇಲ್ಲ](NEG) [ಇಲ್ಲ](NEG), ಸರಿಯಾಗಿ ಹೇಳ್ತೀನಿ."]
    kn-en_mixed: ["Sorry, ತಪ್ಪಾಗಿ ಹೇಳ್ದೆ.", "[ಇಲ್ಲ](NEG) [ಇಲ್ಲ](NEG), correct ಆಗಿ ಹೇಳ್ತೀನಿ."]
    kn-en_latn: ["Sorry, tappaagi helde.", "[Illa](NEG) [illa](NEG), sariyaagi heltini."]
    hi: ["माफ़ कीजिए, मैंने गलत बोला।", "[नहीं](NEG) रुकिए, सही बताती हूँ।"]
    hi_m: ["माफ़ कीजिए, मैंने गलत बोला।", "[नहीं](NEG) रुकिए, सही बताता हूँ।"]
    hi-en_latn: ["Sorry, maine galat bola.", "[Nahi](NEG) ruko, sahi batati hoon."]
    hi-en_latn_m: ["Sorry, maine galat bola.", "[Nahi](NEG) ruko, sahi batata hoon."]
  no_generic:
    en: "[No](NEG), that is [not](NEG) my situation."
    kn: "[ಇಲ್ಲ](NEG), ನನ್ನ ಸಮಸ್ಯೆ ಅದು [ಅಲ್ಲ](NEG)."
    kn-en_mixed: "[ಇಲ್ಲ](NEG), ನನ್ನ problem ಅದು [ಅಲ್ಲ](NEG)."
    kn-en_latn: "[Illa](NEG), nanna samasye adu [alla](NEG)."
    hi: "[नहीं](NEG), मेरा मामला वो [नहीं](NEG) है।"
    hi-en_latn: "[Nahi](NEG), mera case woh [nahi](NEG) hai."
  reask_prefix:
    en: "Let me put it simply: "
    kn: "ಸುಲಭವಾಗಿ ಹೇಳಬೇಕಂದ್ರೆ: "
    hi: "आसान शब्दों में: "
  opening_system:
    en: "Namaskara. Please tell me what happened, in your own words."
    kn: "ನಮಸ್ಕಾರ. ಏನಾಯಿತು ಅಂತ ನಿಮ್ಮದೇ ಮಾತಿನಲ್ಲಿ ಹೇಳಿ."
    hi: "नमस्ते। जो हुआ, अपने शब्दों में बताइए।"
