# LexVaani-IN rendering lexicon (v0.1).  ALL non-English text here requires
# native-speaker review (Gate 3).  Variant keys:
#   en | kn | hi | kn-en_latn (Kanglish romanized) | kn-en_mixed (Kannada script
#   + Latin English words) | hi-en_latn (Hinglish romanized)
#
# Case forms: a value is either "full form" (the whole string is the mention
# span, used for fused Kannada suffixes) or [span, suffix] (suffix such as a
# Hindi postposition stays outside the span).  When a noun gives a plain string
# the renderer appends the default case marker as an outside-span suffix.
# Cases: nom gen dat acc erg abl  (Hindi also gen_m gen_f gen_pl).

case_markers:
  en: {nom: "", gen: "'s", dat: "", acc: "", erg: "", abl: ""}
  kn: {nom: "", gen: " ಅವರ", dat: " ಅವರಿಗೆ", acc: " ಅವರನ್ನು", erg: "", abl: " ಅವರಿಂದ"}
  kn-en_mixed: {nom: "", gen: " ಅವರ", dat: " ಅವರಿಗೆ", acc: " ಅವರನ್ನು", erg: "", abl: " ಅವರಿಂದ"}
  kn-en_latn: {nom: "", gen: " avra", dat: " avrige", acc: " avranna", erg: "", abl: " avrinda"}
  hi: {nom: "", gen_m: " का", gen_f: " की", gen_pl: " के", dat: " को", acc: " को", erg: " ने", abl: " से"}
  hi-en_latn: {nom: "", gen_m: " ka", gen_f: " ki", gen_pl: " ke", dat: " ko", acc: " ko", erg: " ne", abl: " se"}

# Third-person pronouns. Kannada/Hindi use the honorific plural for adults and
# organisations (gender-neutral verb agreement in Kannada); see guidelines §2.4.
pronouns:
  honorific:
    en:
      m: {nom: he, gen: his, dat: him, acc: him, erg: he, abl: him}
      f: {nom: she, gen: her, dat: her, acc: her, erg: she, abl: her}
      n: {nom: they, gen: their, dat: them, acc: them, erg: they, abl: them}
    kn: {nom: ಅವರು, gen: ಅವರ, dat: ಅವರಿಗೆ, acc: ಅವರನ್ನು, erg: ಅವರು, abl: ಅವರಿಂದ}
    kn-en_mixed: {nom: ಅವರು, gen: ಅವರ, dat: ಅವರಿಗೆ, acc: ಅವರನ್ನು, erg: ಅವರು, abl: ಅವರಿಂದ}
    kn-en_latn: {nom: avru, gen: avra, dat: avrige, acc: avranna, erg: avru, abl: avrinda}
    hi: {nom: वो, gen_m: उनका, gen_f: उनकी, gen_pl: उनके, dat: उनको, acc: उनको, erg: उन्होंने, abl: उनसे}
    hi-en_latn: {nom: woh, gen_m: unka, gen_f: unki, gen_pl: unke, dat: unko, acc: unko, erg: unhone, abl: unse}

