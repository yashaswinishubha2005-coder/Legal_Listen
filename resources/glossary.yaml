# Term-aligned en / kn / hi legal glossary (v0.1). ALL entries TO_VERIFY by a native
# speaker with legal background. `colloquial` lists words users actually say.
# `is_legal_term: true` terms are checked by the label-leakage QC.
terms:
  - {term_id: fir, category: procedure, en: First Information Report (FIR), kn: ಪ್ರಥಮ ವರ್ತಮಾನ ವರದಿ (ಎಫ್‌ಐಆರ್), hi: प्रथम सूचना रिपोर्ट (एफ़आईआर), kn_latn: FIR, hi_latn: FIR, colloquial: {en: [police complaint, FIR], kn: [ದೂರು, ಕಂಪ್ಲೇಂಟ್], hi: [शिकायत, रिपोर्ट]}, plain_definition_en: "The first written record the police make of information about a cognizable offence.", is_legal_term: false, notes: FIR is everyday vocabulary; not treated as leakage}
  - {term_id: complaint, category: procedure, en: complaint, kn: ದೂರು, hi: शिकायत, kn_latn: dooru, hi_latn: shikayat, colloquial: {kn: [ಕಂಪ್ಲೇಂಟ್], hi: [कंप्लेंट]}, plain_definition_en: "Telling the police, a magistrate or an authority that a wrong was done.", is_legal_term: false}
  - {term_id: cognizable, category: procedure, en: cognizable offence, kn: ಸಂಜ್ಞೇಯ ಅಪರಾಧ, hi: संज्ञेय अपराध, plain_definition_en: "A serious offence for which police can register an FIR and investigate without a magistrate's order.", is_legal_term: true}
  - {term_id: non_cognizable, category: procedure, en: non-cognizable offence, kn: ಅಸಂಜ್ಞೇಯ ಅಪರಾಧ, hi: असंज्ञेय अपराध, plain_definition_en: "A less serious offence for which police need a magistrate's permission to investigate.", is_legal_term: true}
  - {term_id: zero_fir, category: procedure, en: Zero FIR, kn: ಶೂನ್ಯ ಎಫ್‌ಐಆರ್, hi: ज़ीरो एफ़आईआर, plain_definition_en: "An FIR registered at any police station regardless of where the offence happened, later transferred.", is_legal_term: true}
  - {term_id: magistrate, category: institution, en: Magistrate, kn: ಮ್ಯಾಜಿಸ್ಟ್ರೇಟ್, hi: मजिस्ट्रेट, plain_definition_en: "A judicial officer who handles criminal complaints and orders at the first level.", is_legal_term: false}
  - {term_id: superintendent_of_police, category: institution, en: Superintendent of Police (SP), kn: ಪೊಲೀಸ್ ವರಿಷ್ಠಾಧಿಕಾರಿ (ಎಸ್‌ಪಿ), hi: पुलिस अधीक्षक (एसपी), plain_definition_en: "The senior police officer of a district.", is_legal_term: false}
  - {term_id: bail, category: procedure, en: bail, kn: ಜಾಮೀನು, hi: ज़मानत, plain_definition_en: "Release of an accused person from custody on conditions while the case continues.", is_legal_term: false}
  - {term_id: hurt, category: criminal, en: hurt, kn: ನೋವು / ಗಾಯ, hi: चोट / उपहति, plain_definition_en: "Causing bodily pain, disease or infirmity to a person.", is_legal_term: true, notes: legal 'hurt' vs everyday 'injury'}
  - {term_id: criminal_intimidation, category: criminal, en: criminal intimidation, kn: ಕ್ರಿಮಿನಲ್ ಬೆದರಿಕೆ, hi: आपराधिक अभित्रास / धमकी, colloquial: {en: [threat], kn: [ಬೆದರಿಕೆ], hi: [धमकी]}, plain_definition_en: "Threatening someone with harm to cause alarm or make them do or not do something.", is_legal_term: true}
  - {term_id: theft, category: criminal, en: theft, kn: ಕಳ್ಳತನ, hi: चोरी, plain_definition_en: "Dishonestly taking movable property out of someone's possession without consent.", is_legal_term: false}
  - {term_id: cheating, category: criminal, en: cheating, kn: ವಂಚನೆ / ಮೋಸ, hi: छल / धोखाधड़ी, colloquial: {kn: [ಮೋಸ], hi: [धोखा]}, plain_definition_en: "Deceiving someone to dishonestly make them hand over property or do something.", is_legal_term: true}
  - {term_id: forgery, category: criminal, en: forgery, kn: ಖೋಟಾ ದಾಖಲೆ ಸೃಷ್ಟಿ, hi: कूटरचना / जालसाज़ी, colloquial: {kn: [ನಕಲಿ ದಾಖಲೆ], hi: [नकली कागज़]}, plain_definition_en: "Making a false document with intent to cause damage or support a false claim.", is_legal_term: true}
  - {term_id: criminal_trespass, category: criminal, en: criminal trespass, kn: ಅಪರಾಧಿಕ ಅತಿಕ್ರಮ ಪ್ರವೇಶ, hi: आपराधिक अतिचार, plain_definition_en: "Entering or staying on another's property to commit an offence, intimidate or annoy.", is_legal_term: true}
  - {term_id: stalking, category: criminal, en: stalking, kn: ಹಿಂಬಾಲಿಕೆ, hi: पीछा करना, plain_definition_en: "Repeatedly following or contacting a woman, or monitoring her online, despite clear disinterest.", is_legal_term: true}
  - {term_id: cruelty_498a, category: family, en: cruelty (by husband or relatives), kn: ಕ್ರೌರ್ಯ, hi: क्रूरता, plain_definition_en: "Wilful conduct likely to drive a woman to serious harm, or harassment to meet unlawful demands such as dowry.", is_legal_term: true}
  - {term_id: dowry, category: family, en: dowry, kn: ವರದಕ್ಷಿಣೆ, hi: दहेज, plain_definition_en: "Property or money given or demanded in connection with a marriage.", is_legal_term: false}
  - {term_id: domestic_violence, category: family, en: domestic violence, kn: ಕೌಟುಂಬಿಕ ದೌರ್ಜನ್ಯ, hi: घरेलू हिंसा, plain_definition_en: "Physical, sexual, verbal, emotional or economic abuse of a woman in a domestic relationship.", is_legal_term: true}
  - {term_id: protection_order, category: family, en: protection order, kn: ರಕ್ಷಣಾ ಆದೇಶ, hi: संरक्षण आदेश, plain_definition_en: "A magistrate's order stopping the abuser from committing violence or contacting the woman.", is_legal_term: true}
  - {term_id: residence_order, category: family, en: residence order, kn: ವಾಸ ಆದೇಶ, hi: निवास आदेश, plain_definition_en: "An order protecting a woman's right to live in the shared household.", is_legal_term: true}
  - {term_id: shared_household, category: family, en: shared household, kn: ಹಂಚಿಕೊಂಡ ಮನೆ, hi: साझा घर, plain_definition_en: "The house where the woman lives or has lived in a domestic relationship.", is_legal_term: true}
  - {term_id: maintenance, category: family, en: maintenance, kn: ಜೀವನಾಂಶ, hi: भरण-पोषण / गुज़ारा भत्ता, colloquial: {hi: [खर्चा]}, plain_definition_en: "Regular money a person must pay to support a spouse, child or parent who cannot support themselves.", is_legal_term: true}
  - {term_id: alimony, category: family, en: permanent alimony, kn: ಶಾಶ್ವತ ಜೀವನಾಂಶ, hi: स्थायी निर्वाह भत्ता, plain_definition_en: "Maintenance ordered at or after divorce.", is_legal_term: true}
  - {term_id: divorce, category: family, en: divorce, kn: ವಿಚ್ಛೇದನ, hi: तलाक / विवाह-विच्छेद, colloquial: {kn: [ಡಿವೋರ್ಸ್], hi: [डिवोर्स]}, plain_definition_en: "Legal ending of a marriage by court decree.", is_legal_term: false}
  - {term_id: mutual_consent, category: family, en: divorce by mutual consent, kn: ಪರಸ್ಪರ ಒಪ್ಪಿಗೆಯ ವಿಚ್ಛೇದನ, hi: आपसी सहमति से तलाक, plain_definition_en: "Divorce where both spouses agree and apply together.", is_legal_term: true}
  - {term_id: custody, category: family, en: custody, kn: ಪಾಲನೆ / ಸುಪರ್ದಿ, hi: अभिरक्षा / कस्टडी, plain_definition_en: "Who a child lives with and who takes day-to-day decisions.", is_legal_term: true}
  - {term_id: guardian, category: family, en: guardian, kn: ಪೋಷಕ / ರಕ್ಷಕ, hi: संरक्षक, plain_definition_en: "A person legally responsible for a minor or their property.", is_legal_term: true}
  - {term_id: minor, category: family, en: minor, kn: ಅಪ್ರಾಪ್ತ, hi: नाबालिग, plain_definition_en: "A person below 18 years.", is_legal_term: false}
  - {term_id: partition, category: property, en: partition, kn: ವಿಭಾಗ / ಪಾಲು, hi: बँटवारा / विभाजन, colloquial: {kn: [ಪಾಲು], hi: [हिस्सा]}, plain_definition_en: "Dividing jointly owned property so each co-owner gets a separate share.", is_legal_term: false}
  - {term_id: coparcener, category: property, en: coparcener, kn: ಸಹವಾರಸುದಾರ, hi: सहदायिक, plain_definition_en: "A member of a Hindu joint family who has a birthright in ancestral property (daughters included).", is_legal_term: true}
  - {term_id: ancestral_property, category: property, en: ancestral property, kn: ಪಿತ್ರಾರ್ಜಿತ ಆಸ್ತಿ, hi: पैतृक / पुश्तैनी संपत्ति, plain_definition_en: "Property inherited through the male line up to four generations (Hindu law concept).", is_legal_term: true}
  - {term_id: sale_deed, category: property, en: sale deed, kn: ಕ್ರಯಪತ್ರ (ಸೇಲ್ ಡೀಡ್), hi: बैनामा / विक्रय विलेख, kn_latn: sale deed, hi_latn: sale deed, plain_definition_en: "The registered document that transfers ownership of immovable property on sale.", is_legal_term: false}
  - {term_id: khata, category: property, en: khata, kn: ಖಾತಾ, hi: खाता, plain_definition_en: "Municipal/panchayat record of who owns and pays tax for a property (Karnataka).", is_legal_term: false}
  - {term_id: rtc_pahani, category: property, en: "RTC (Record of Rights, Tenancy and Crops) / pahani", kn: ಪಹಣಿ (ಆರ್‌ಟಿಸಿ), hi: आरटीसी / अधिकार अभिलेख, plain_definition_en: "Karnataka land record showing owner, extent, cultivation and liabilities of agricultural land.", is_legal_term: false}
  - {term_id: survey_number, category: property, en: survey number, kn: ಸರ್ವೇ ನಂಬರ್, hi: सर्वे नंबर / खसरा नंबर, plain_definition_en: "The identification number of a plot of land in revenue records.", is_legal_term: false}
  - {term_id: mutation, category: property, en: mutation, kn: ಖಾತೆ ಬದಲಾವಣೆ (ಮ್ಯುಟೇಷನ್), hi: दाखिल-खारिज / नामांतरण, plain_definition_en: "Changing the owner's name in revenue records after sale or inheritance.", is_legal_term: false}
  - {term_id: encroachment, category: property, en: encroachment, kn: ಒತ್ತುವರಿ, hi: अतिक्रमण, colloquial: {hi: [कब्ज़ा]}, plain_definition_en: "Unlawfully occupying or building on someone else's land.", is_legal_term: false}
  - {term_id: injunction, category: property, en: injunction, kn: ನಿಷೇಧಾಜ್ಞೆ / ತಡೆಯಾಜ್ಞೆ, hi: निषेधाज्ञा / स्टे, colloquial: {kn: [ಸ್ಟೇ], hi: [स्टे]}, plain_definition_en: "A court order stopping someone from doing something (e.g. building or selling).", is_legal_term: true}
  - {term_id: limitation_period, category: procedure, en: limitation period, kn: ಕಾಲಮಿತಿ, hi: परिसीमा अवधि, colloquial: {en: [time limit]}, plain_definition_en: "The time within which a case must be filed, after which the court may refuse to hear it.", is_legal_term: true}
  - {term_id: consumer, category: consumer, en: consumer, kn: ಗ್ರಾಹಕ, hi: उपभोक्ता, plain_definition_en: "A person who buys goods or hires services for personal use, not for resale.", is_legal_term: false}
  - {term_id: deficiency_in_service, category: consumer, en: deficiency in service, kn: ಸೇವಾ ನ್ಯೂನತೆ, hi: सेवा में कमी, plain_definition_en: "Any fault or shortcoming in the quality or manner of a paid service.", is_legal_term: true}
  - {term_id: defect, category: consumer, en: defect, kn: ದೋಷ, hi: दोष / खराबी, plain_definition_en: "Any fault, imperfection or shortcoming in quality or standard of goods.", is_legal_term: false}
  - {term_id: unfair_trade_practice, category: consumer, en: unfair trade practice, kn: ಅನುಚಿತ ವ್ಯಾಪಾರ ಪದ್ಧತಿ, hi: अनुचित व्यापार व्यवहार, plain_definition_en: "Deceptive or unfair methods of selling, e.g. refusing refunds promised in a return policy.", is_legal_term: true}
  - {term_id: district_commission, category: institution, en: District Consumer Disputes Redressal Commission, kn: ಜಿಲ್ಲಾ ಗ್ರಾಹಕ ವ್ಯಾಜ್ಯ ಪರಿಹಾರ ಆಯೋಗ, hi: ज़िला उपभोक्ता विवाद प्रतितोष आयोग, colloquial: {en: [consumer court], kn: [ಗ್ರಾಹಕ ನ್ಯಾಯಾಲಯ], hi: [उपभोक्ता अदालत]}, plain_definition_en: "The first-level consumer forum in each district.", is_legal_term: false}
  - {term_id: cyber_helpline_1930, category: institution, en: National Cyber Crime Helpline 1930, kn: ರಾಷ್ಟ್ರೀಯ ಸೈಬರ್ ಅಪರಾಧ ಸಹಾಯವಾಣಿ 1930, hi: राष्ट्रीय साइबर अपराध हेल्पलाइन 1930, plain_definition_en: "Helpline to report online financial fraud quickly so funds can be frozen.", is_legal_term: false, notes: verify number and portal (cybercrime.gov.in)}
  - {term_id: identity_theft, category: cyber, en: identity theft, kn: ಗುರುತು ಕಳ್ಳತನ, hi: पहचान की चोरी, plain_definition_en: "Fraudulently using someone's password, signature or other unique identification feature.", is_legal_term: true}
  - {term_id: personation, category: cyber, en: cheating by personation, kn: ಸೋಗು ಹಾಕಿ ವಂಚನೆ, hi: प्रतिरूपण द्वारा छल, plain_definition_en: "Cheating by pretending to be someone else, including online.", is_legal_term: true}
  - {term_id: violation_of_privacy, category: cyber, en: violation of privacy, kn: ಖಾಸಗಿತನ ಉಲ್ಲಂಘನೆ, hi: निजता का उल्लंघन, plain_definition_en: "Capturing or publishing images of a person's private area without consent.", is_legal_term: true}
  - {term_id: otp, category: cyber, en: OTP (one-time password), kn: ಓಟಿಪಿ, hi: ओटीपी, plain_definition_en: "A short code sent to your phone to approve a transaction; never share it.", is_legal_term: false}
  - {term_id: legal_aid, category: institution, en: free legal aid (District Legal Services Authority), kn: ಉಚಿತ ಕಾನೂನು ನೆರವು (ಜಿಲ್ಲಾ ಕಾನೂನು ಸೇವೆಗಳ ಪ್ರಾಧಿಕಾರ), hi: निःशुल्क विधिक सहायता (ज़िला विधिक सेवा प्राधिकरण), plain_definition_en: "Free lawyer and advice for eligible people (women, children, low-income and others).", is_legal_term: false}
