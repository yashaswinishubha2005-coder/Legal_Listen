# Criminal domain issue library (v0.1). Provisions are TO_VERIFY: they are
# candidates only and must be checked against the parsed official corpus.
# All kn/hi/code-mixed text needs native-speaker review.

_shared:
  police_slot: &police_slot
    slot: POLICE
    kind: organization
    role: organization
    nouns: [police]
    named: false
  complaint_filed: &complaint_filed
    element_id: complaint_filed
    critical: false
    order: 9
    description: The user has already given a complaint to the police.
    event_type: police_complaint
    args: {POLICE: recipient}
    question:
      en: Have you given a complaint to the police about this?
      kn: ಇದರ ಬಗ್ಗೆ ಪೊಲೀಸರಿಗೆ ದೂರು ಕೊಟ್ಟಿದ್ದೀರಾ?
      hi: क्या आपने इसके बारे में पुलिस में शिकायत दी है?
    proposition:
      satisfied: The speaker gave a complaint to the police.
      contradicted: The speaker has not gone to the police.
    satisfied:
      en: I went to [the police station](@POLICE) and gave a [complaint](TRIG).
      kn: ನಾನು [ಪೊಲೀಸ್ ಠಾಣೆಗೆ](@POLICE) ಹೋಗಿ [ದೂರು ಕೊಟ್ಟೆ](TRIG).
      kn-en_latn: Naanu [police station](@POLICE) ge hogi [complaint kotte](TRIG).
      kn-en_mixed: ನಾನು [police station](@POLICE) ಗೆ ಹೋಗಿ [complaint ಕೊಟ್ಟೆ](TRIG).
      hi: मैं [पुलिस स्टेशन](@POLICE) {g:SPK|m:गया|f:गई} और [शिकायत दर्ज कराई](TRIG)।
      hi-en_latn: Main [police station](@POLICE) {g:SPK|m:gaya|f:gayi} aur [complaint di](TRIG).
    contradicted:
      en: I have [not](NEG) [gone](TRIG) to [the police](@POLICE) yet.
      kn: ನಾನು ಇನ್ನೂ [ಪೊಲೀಸರ](@POLICE) ಹತ್ತಿರ [ಹೋಗಿಲ್ಲ](TRIG,NEG).
      kn-en_latn: Naanu innu [police](@POLICE) hatra [hogilla](TRIG,NEG).
      kn-en_mixed: ನಾನು ಇನ್ನೂ [police](@POLICE) ಹತ್ತಿರ [ಹೋಗಿಲ್ಲ](TRIG,NEG).
      hi: मैं अभी तक [पुलिस](@POLICE) के पास [नहीं](NEG) {g:SPK|m:[गया](TRIG)|f:[गई](TRIG)} हूँ।
      hi-en_latn: Main abhi tak [police](@POLICE) ke paas [nahi](NEG) {g:SPK|m:[gaya](TRIG)|f:[gayi](TRIG)} hoon.
  no_witness: &no_witness
    en: There were [no](NEG) [witnesses](EVD) around.
    kn: ಅಲ್ಲಿ [ನೋಡಿದವರು](EVD) ಯಾರೂ [ಇರಲಿಲ್ಲ](NEG).
    kn-en_latn: Alli [nodidavru](EVD) yaaru [iralilla](NEG).
    kn-en_mixed: ಅಲ್ಲಿ [witness](EVD) ಯಾರೂ [ಇರಲಿಲ್ಲ](NEG).
    hi: वहाँ [कोई गवाह](EVD) [नहीं](NEG) था।
    hi-en_latn: Wahan [koi witness](EVD) [nahi](NEG) tha.

issues:
  # ------------------------------------------------------------------ hurt
  - issue_id: crim.hurt_assault
    domain: criminal
    title: {en: Hurt / assault, kn: ಹಲ್ಲೆ / ಗಾಯ, hi: मारपीट / चोट}
    plain_summary:
      en: Someone deliberately used physical force on you and caused you bodily pain or injury.
      kn: ಯಾರೋ ಬೇಕಂತಲೇ ನಿಮ್ಮ ಮೇಲೆ ಬಲ ಪ್ರಯೋಗಿಸಿ ದೈಹಿಕ ನೋವು ಅಥವಾ ಗಾಯ ಮಾಡಿದ್ದಾರೆ.
      hi: किसी ने जानबूझकर आप पर बल प्रयोग किया और आपको शारीरिक दर्द या चोट पहुँचाई।
    risk_level: medium
    default_triage: self_help
    cast:
      - {slot: RESP, role: respondent, nouns: [neighbour, colleague, cousin]}
      - *police_slot
    value_slots: {PLACE: [market, bus_stand, temple, our_house]}
    setup:
      en: There is an ongoing quarrel between {RESP} and me.
      kn: "{RESP} ಮತ್ತು ನನ್ನ ಮಧ್ಯೆ ಜಗಳ ಇದೆ."
      kn-en_latn: "{RESP} mattu nanna madhye jagala ide."
      kn-en_mixed: "{RESP} ಮತ್ತು ನನ್ನ ಮಧ್ಯೆ problem ಇದೆ."
      hi: "{RESP} और मेरे बीच झगड़ा चल रहा है।"
      hi-en_latn: "{RESP} aur mere beech jhagda chal raha hai."
    elements:
      - element_id: act_of_force
        critical: true
        order: 1
        date_slot_required: true
        description: The respondent used physical force on the user (hit, pushed, kicked).
        event_type: physical_assault
        args: {RESP: agent, PLACE: place}
        question:
          en: Did the person physically hit or push you? What exactly happened?
          kn: ಆ ವ್ಯಕ್ತಿ ನಿಮಗೆ ಹೊಡೆದರಾ ಅಥವಾ ತಳ್ಳಿದರಾ? ನಿಖರವಾಗಿ ಏನಾಯಿತು?
          hi: क्या उस व्यक्ति ने आपको मारा या धक्का दिया? ठीक-ठीक क्या हुआ?
        proposition:
          satisfied: The respondent physically hit the speaker.
          contradicted: The respondent did not physically hit the speaker.
        satisfied:
          en: "{RESP} [hit](TRIG) me with a stick near {PLACE} {DATE}."
          kn: "{DATE} {RESP} {PLACE} ಹತ್ತಿರ ನನಗೆ ಕೋಲಿನಿಂದ [ಹೊಡೆದರು](TRIG)."
          kn-en_latn: "{DATE} {RESP} {PLACE} hatra nange kolinda [hodedru](TRIG)."
          kn-en_mixed: "{DATE} {RESP} {PLACE} ಹತ್ತಿರ ನನಗೆ stick ಇಂದ [ಹೊಡೆದ್ರು](TRIG)."
          hi: "{DATE} {RESP.erg} {PLACE.obl} के पास मुझे डंडे से [मारा](TRIG)।"
          hi-en_latn: "{DATE} {RESP.erg} {PLACE.obl} ke paas mujhe dande se [maara](TRIG)."
        contradicted:
          en: "{RESP} only shouted at me near {PLACE} {DATE}, but [never](NEG) actually [hit](TRIG) me."
          kn: "{DATE} {RESP} {PLACE} ಹತ್ತಿರ ನನ್ನ ಮೇಲೆ ಜೋರಾಗಿ ಕೂಗಾಡಿದರು, ಆದರೆ [ಹೊಡೆಯಲಿಲ್ಲ](TRIG,NEG)."
          kn-en_latn: "{DATE} {RESP} {PLACE} hatra nanna mele joraagi koogaadidru, aadre [hodeyalilla](TRIG,NEG)."
          kn-en_mixed: "{DATE} {RESP} {PLACE} ಹತ್ತಿರ ನನ್ನ ಮೇಲೆ shout ಮಾಡಿದ್ರು, ಆದ್ರೆ [ಹೊಡೆಯಲಿಲ್ಲ](TRIG,NEG)."
          hi: "{DATE} {RESP} {PLACE.obl} के पास मुझ पर {g:RESP|m:चिल्लाए|f:चिल्लाईं|n:चिल्लाए}, लेकिन [मारा](TRIG) [नहीं](NEG)।"
          hi-en_latn: "{DATE} {RESP} {PLACE.obl} ke paas mujh par {g:RESP|m:chillaaye|f:chillaayi|n:chillaaye}, lekin [maara](TRIG) [nahi](NEG)."
      - element_id: injury_caused
        critical: true
        order: 2
        description: The user suffered bodily pain, injury or bleeding.
        event_type: injury
        caused_by: act_of_force
        question:
          en: Were you injured? Did you get any cuts, bruises or bleeding?
          kn: ನಿಮಗೆ ಗಾಯ ಆಯಿತಾ? ಏನಾದರೂ ರಕ್ತ ಅಥವಾ ಊತ ಆಯಿತಾ?
          hi: क्या आपको चोट लगी? कोई घाव, सूजन या खून?
        proposition:
          satisfied: The speaker was injured.
          contradicted: The speaker was not injured.
        satisfied:
          en: I got a [cut](TRIG) on my head and it was bleeding.
          kn: ನನ್ನ ತಲೆಗೆ [ಗಾಯ ಆಯ್ತು](TRIG), ರಕ್ತ ಬರ್ತಿತ್ತು.
          kn-en_latn: Nanna talege [gaaya aaytu](TRIG), rakta bartittu.
          kn-en_mixed: ನನ್ನ head ಗೆ [ಗಾಯ ಆಯ್ತು](TRIG), blood ಬರ್ತಿತ್ತು.
          hi: मेरे सिर पर [चोट लगी](TRIG) और खून बह रहा था।
          hi-en_latn: Mere sir par [chot lagi](TRIG) aur khoon beh raha tha.
        contradicted:
          en: Luckily I did [not](NEG) get [hurt](TRIG) at all.
          kn: ಅದೃಷ್ಟಕ್ಕೆ ನನಗೆ ಏನೂ [ಗಾಯ ಆಗಲಿಲ್ಲ](TRIG,NEG).
          kn-en_latn: Adrushtakke nange enu [gaaya aagalilla](TRIG,NEG).
          kn-en_mixed: Luckily ನನಗೆ ಏನೂ [ಗಾಯ ಆಗಲಿಲ್ಲ](TRIG,NEG).
          hi: शुक्र है मुझे कोई [चोट](TRIG) [नहीं](NEG) लगी।
          hi-en_latn: Shukr hai mujhe koi [chot](TRIG) [nahi](NEG) lagi.
      - element_id: intentional
        critical: true
        may_be_unknown: true
        order: 1
        description: The force was used deliberately, not by accident.
        question:
          en: Do you think it was done deliberately, or could it have been an accident?
          kn: ಇದು ಬೇಕಂತಲೇ ಮಾಡಿದ್ದಾ ಅಥವಾ ಆಕಸ್ಮಿಕವಾಗಿ ಆಯ್ತಾ?
          hi: क्या यह जानबूझकर किया गया था या गलती से हुआ?
        proposition:
          satisfied: The respondent acted deliberately.
          contradicted: It was an accident.
        satisfied:
          en: "{RESP} did it on purpose, it was [not](NEG) an accident."
          kn: "{RESP} ಬೇಕಂತಲೇ ಮಾಡಿದರು, ಇದು ಆಕಸ್ಮಿಕ [ಅಲ್ಲ](NEG)."
          kn-en_latn: "{RESP} bekanthale maadidru, idu accident [alla](NEG)."
          kn-en_mixed: "{RESP} ಬೇಕಂತಲೇ ಮಾಡಿದ್ರು, ಇದು accident [ಅಲ್ಲ](NEG)."
          hi: "{RESP.erg} जानबूझकर किया, यह कोई हादसा [नहीं](NEG) था।"
          hi-en_latn: "{RESP.erg} jaanbujhkar kiya, yeh koi accident [nahi](NEG) tha."
        contradicted:
          en: "It happened by accident; {RESP} did [not](NEG) mean to hurt me."
          kn: "ಅದು ಆಕಸ್ಮಿಕವಾಗಿ ಆಯ್ತು, {RESP} ಬೇಕಂತ ಮಾಡಿದ್ದು [ಅಲ್ಲ](NEG)."
          kn-en_latn: "Adu accidental aagi aaytu, {RESP} bekantha maadiddu [alla](NEG)."
          kn-en_mixed: "ಅದು accidental ಆಗಿ ಆಯ್ತು, {RESP} ಬೇಕಂತ ಮಾಡಿದ್ದು [ಅಲ್ಲ](NEG)."
          hi: "वो गलती से हुआ, {RESP.gen_m} इरादा मुझे चोट पहुँचाने का [नहीं](NEG) था।"
          hi-en_latn: "Woh galti se hua, {RESP.gen_m} iraada mujhe chot pahunchane ka [nahi](NEG) tha."
      - *complaint_filed
    evidence:
      - evidence_id: medical_report
        evidence_type: medical_record
        supports: [injury_caused]
        held:
          en: I have the [doctor's report](EVD).
          kn: ನನ್ನ ಹತ್ತಿರ [ಡಾಕ್ಟರ್ ರಿಪೋರ್ಟ್](EVD) ಇದೆ.
          kn-en_latn: Nanna hatra [doctor report](EVD) ide.
          kn-en_mixed: ನನ್ನ ಹತ್ತಿರ [doctor report](EVD) ಇದೆ.
          hi: मेरे पास [डॉक्टर की रिपोर्ट](EVD) है।
          hi-en_latn: Mere paas [doctor ki report](EVD) hai.
        missing:
          en: I did [not](NEG) go to a hospital, so I have [no](NEG) [medical report](EVD).
          kn: ನಾನು ಆಸ್ಪತ್ರೆಗೆ [ಹೋಗಲಿಲ್ಲ](NEG), ಹಾಗಾಗಿ [ರಿಪೋರ್ಟ್](EVD) ಏನೂ [ಇಲ್ಲ](NEG).
          kn-en_latn: Naanu hospital ge [hogalilla](NEG), haagaagi [report](EVD) enu [illa](NEG).
          kn-en_mixed: ನಾನು hospital ಗೆ [ಹೋಗಲಿಲ್ಲ](NEG), so [report](EVD) ಏನೂ [ಇಲ್ಲ](NEG).
          hi: मैं अस्पताल [नहीं](NEG) {g:SPK|m:गया|f:गई}, इसलिए मेरे पास [कोई मेडिकल रिपोर्ट](EVD) [नहीं](NEG) है।
          hi-en_latn: Main hospital [nahi](NEG) {g:SPK|m:gaya|f:gayi}, isliye mere paas [koi medical report](EVD) [nahi](NEG) hai.
      - evidence_id: eyewitness
        evidence_type: witness
        supports: [act_of_force]
        held:
          en: "[Two people from the tea shop](EVD) saw everything."
          kn: "[ಟೀ ಅಂಗಡಿಯ ಇಬ್ಬರು](EVD) ಎಲ್ಲಾ ನೋಡಿದ್ದಾರೆ."
          kn-en_latn: "[Tea angadiya ibbaru](EVD) ella nodiddare."
          kn-en_mixed: "[Tea shop ಅವರು ಇಬ್ಬರು](EVD) ಎಲ್ಲಾ ನೋಡಿದ್ದಾರೆ."
          hi: "[चाय की दुकान वाले दो लोगों](EVD) ने सब देखा।"
          hi-en_latn: "[Chai ki dukaan wale do logon](EVD) ne sab dekha."
        missing: *no_witness
    risk_facts:
      - flag: imminent_violence
        template:
          en: "{RESP} said {RESP.pron} will come back [tonight](TIMEX:tonight) and finish me off."
          kn: "[ಇವತ್ತು ರಾತ್ರಿ](TIMEX:tonight) ಮತ್ತೆ ಬಂದು ನನ್ನನ್ನು ಮುಗಿಸ್ತೀನಿ ಅಂತ {RESP} ಹೇಳಿದ್ದಾರೆ."
          kn-en_latn: "[Ivattu raatri](TIMEX:tonight) matte bandu nannanna mugistini antha {RESP} heliddare."
          kn-en_mixed: "[Tonight](TIMEX:tonight) ಮತ್ತೆ ಬಂದು ನನ್ನನ್ನು finish ಮಾಡ್ತೀನಿ ಅಂತ {RESP} ಹೇಳಿದ್ದಾರೆ."
          hi: "{RESP.erg} कहा है कि [आज रात](TIMEX:tonight) फिर आकर मुझे खत्म कर {g:RESP|m:देंगे|f:देंगी|n:देंगे}।"
          hi-en_latn: "{RESP.erg} kaha hai ki [aaj raat](TIMEX:tonight) phir aakar mujhe khatam kar {g:RESP|m:denge|f:dengi|n:denge}."
    routing_variables:
      - {name: law_regime, values: [old, new], description: "incident before / on-or-after 2024-07-01"}
    candidate_provisions:
      - {provision_id: "BNS:115(2)", when: {law_regime: [new]}, title_hint: Voluntarily causing hurt}
      - {provision_id: "BNS:118(1)", when: {law_regime: [new]}, title_hint: Voluntarily causing hurt by dangerous weapons or means, note: only if the weapon/means qualifies; verify}
      - {provision_id: "BNSS:174", when: {law_regime: [new]}, title_hint: Information as to non-cognizable cases, note: simple hurt may be non-cognizable; verify}
      - {provision_id: "IPC:323", when: {law_regime: [old]}, title_hint: Punishment for voluntarily causing hurt}
      - {provision_id: "IPC:324", when: {law_regime: [old]}, title_hint: Voluntarily causing hurt by dangerous weapons or means, note: only if the weapon/means qualifies; verify}
      - {provision_id: "CrPC:155", when: {law_regime: [old]}, title_hint: Information as to non-cognizable cases}
    limitation_notes: Period of limitation for taking cognizance depends on the maximum punishment (BNSS chapter on limitation / CrPC s.468). TO_VERIFY.
    confusable_with: [crim.criminal_intimidation, fam.domestic_violence]
    co_occurs_with: [crim.criminal_intimidation, prop.boundary_dispute]

  # ------------------------------------------------------- intimidation
  - issue_id: crim.criminal_intimidation
    domain: criminal
    title: {en: Criminal intimidation, kn: ಕ್ರಿಮಿನಲ್ ಬೆದರಿಕೆ, hi: आपराधिक धमकी}
    plain_summary:
      en: Someone threatened to harm you, your reputation or property to frighten you or force you to do something.
      kn: ನಿಮ್ಮನ್ನು ಹೆದರಿಸಲು ಅಥವಾ ಏನಾದರೂ ಮಾಡಿಸಲು ಯಾರೋ ನಿಮಗೆ, ನಿಮ್ಮ ಮರ್ಯಾದೆಗೆ ಅಥವಾ ಆಸ್ತಿಗೆ ಹಾನಿ ಮಾಡುವ ಬೆದರಿಕೆ ಹಾಕಿದ್ದಾರೆ.
      hi: किसी ने आपको डराने या कुछ करवाने के लिए आपको, आपकी इज़्ज़त या संपत्ति को नुकसान पहुँचाने की धमकी दी।
    risk_level: medium
    default_triage: self_help
    cast:
      - {slot: RESP, role: respondent, nouns: [neighbour, colleague, acquaintance, cousin]}
      - *police_slot
    setup:
      en: "{RESP} has been troubling me a lot."
      kn: "{RESP} ನನಗೆ ತುಂಬಾ ತೊಂದರೆ ಕೊಡ್ತಿದ್ದಾರೆ."
      kn-en_latn: "{RESP} nange tumba tondre kodtiddare."
      kn-en_mixed: "{RESP} ನನಗೆ ತುಂಬಾ trouble ಕೊಡ್ತಿದ್ದಾರೆ."
      hi: "{RESP} मुझे बहुत परेशान कर {g:RESP|m:रहे|f:रही|n:रहे} हैं।"
      hi-en_latn: "{RESP} mujhe bahut pareshaan kar {g:RESP|m:rahe|f:rahi|n:rahe} hain."
    elements:
      - element_id: threat_made
        critical: true
        order: 1
        date_slot_required: true
        description: The respondent threatened injury to the user's person, reputation or property.
        event_type: threat
        args: {RESP: agent}
        question:
          en: What exactly did the person say? Did they threaten to harm you, your family or your property?
          kn: ಆ ವ್ಯಕ್ತಿ ನಿಖರವಾಗಿ ಏನು ಹೇಳಿದರು? ನಿಮಗೆ, ನಿಮ್ಮ ಕುಟುಂಬಕ್ಕೆ ಅಥವಾ ಆಸ್ತಿಗೆ ಹಾನಿ ಮಾಡ್ತೀನಿ ಅಂತ ಬೆದರಿಸಿದರಾ?
          hi: उस व्यक्ति ने ठीक-ठीक क्या कहा? क्या आपको, आपके परिवार को या संपत्ति को नुकसान पहुँचाने की धमकी दी?
        proposition:
          satisfied: The respondent threatened to injure the speaker.
          contradicted: The respondent argued but made no threat.
        satisfied:
          en: "{DATE} {RESP} [threatened](TRIG) that {RESP.pron} would break my legs."
          kn: "{DATE} {RESP} ನನ್ನ ಕಾಲು ಮುರಿತೀನಿ ಅಂತ [ಬೆದರಿಕೆ ಹಾಕಿದರು](TRIG)."
          kn-en_latn: "{DATE} {RESP} nanna kaalu muritini antha [bedarike haakidru](TRIG)."
          kn-en_mixed: "{DATE} {RESP} ನನ್ನ legs ಮುರಿತೀನಿ ಅಂತ [threat ಮಾಡಿದ್ರು](TRIG)."
          hi: "{DATE} {RESP.erg} मुझे टाँगें तोड़ देने की [धमकी दी](TRIG)।"
          hi-en_latn: "{DATE} {RESP.erg} mujhe taangein tod dene ki [dhamki di](TRIG)."
        contradicted:
          en: "{DATE} {RESP} argued with me, but did [not](NEG) [threaten](TRIG) me in any way."
          kn: "{DATE} {RESP} ನನ್ನ ಜೊತೆ ವಾದ ಮಾಡಿದರು, ಆದರೆ ಯಾವ [ಬೆದರಿಕೆಯೂ ಹಾಕಲಿಲ್ಲ](TRIG,NEG)."
          kn-en_latn: "{DATE} {RESP} nanna jote vaada maadidru, aadre yaava [bedarikeyu haakalilla](TRIG,NEG)."
          kn-en_mixed: "{DATE} {RESP} ನನ್ನ ಜೊತೆ argue ಮಾಡಿದ್ರು, ಆದ್ರೆ ಯಾವ [threat ಮಾಡಲಿಲ್ಲ](TRIG,NEG)."
          hi: "{DATE} {RESP.erg} मुझसे बहस की, लेकिन कोई [धमकी](TRIG) [नहीं](NEG) दी।"
          hi-en_latn: "{DATE} {RESP.erg} mujhse behes ki, lekin koi [dhamki](TRIG) [nahi](NEG) di."
      - element_id: intent_to_alarm
        critical: true
        may_be_unknown: true
        order: 1
        description: The threat was made to cause alarm or to make the user do / stop doing something.
        question:
          en: Why do you think the person said this — to frighten you, or to make you do or stop doing something?
          kn: ಆ ವ್ಯಕ್ತಿ ಯಾಕೆ ಹೀಗೆ ಹೇಳಿದರು — ನಿಮ್ಮನ್ನು ಹೆದರಿಸೋಕಾ ಅಥವಾ ಏನಾದರೂ ಮಾಡಿಸೋಕಾ?
          hi: उस व्यक्ति ने ऐसा क्यों कहा — आपको डराने के लिए या आपसे कुछ करवाने के लिए?
        proposition:
          satisfied: The threat was meant to frighten the speaker into silence.
          contradicted: The remark was a joke and nobody took it seriously.
        satisfied:
          en: "{RESP} said this to frighten me into keeping quiet."
          kn: "ನಾನು ಸುಮ್ಮನಿರಲಿ ಅಂತ ಹೆದರಿಸೋಕೆ {RESP} ಹೀಗೆ ಹೇಳಿದರು."
          kn-en_latn: "Naanu summaniralu antha hedarisoke {RESP} heege helidru."
          kn-en_mixed: "ನಾನು quiet ಆಗಿರಲಿ ಅಂತ scare ಮಾಡೋಕೆ {RESP} ಹೀಗೆ ಹೇಳಿದ್ರು."
          hi: "{RESP.erg} यह मुझे डराने के लिए कहा ताकि मैं चुप रहूँ।"
          hi-en_latn: "{RESP.erg} yeh mujhe daraane ke liye kaha taaki main chup rahoon."
        contradicted:
          en: "{RESP} said it as a joke in front of everyone, and [nobody](NEG) took it seriously."
          kn: "{RESP} ಎಲ್ಲರ ಮುಂದೆ ತಮಾಷೆಗೆ ಹೇಳಿದ್ದು, ಯಾರೂ ಸೀರಿಯಸ್ ಆಗಿ [ತೊಗೊಳ್ಳಲಿಲ್ಲ](NEG)."
          kn-en_latn: "{RESP} ellara munde tamaashege heliddu, yaaru serious aagi [togolalilla](NEG)."
          kn-en_mixed: "{RESP} ಎಲ್ಲರ ಮುಂದೆ joke ಆಗಿ ಹೇಳಿದ್ದು, ಯಾರೂ serious ಆಗಿ [ತೊಗೊಳ್ಳಲಿಲ್ಲ](NEG)."
          hi: "{RESP.erg} सबके सामने मज़ाक में कहा था, किसी ने उसे गंभीरता से [नहीं](NEG) लिया।"
          hi-en_latn: "{RESP.erg} sabke saamne mazaak mein kaha tha, kisi ne use seriously [nahi](NEG) liya."
      - element_id: repeated_threats
        critical: false
        order: 1
        description: The threats were repeated.
        question:
          en: Has this happened only once, or many times?
          kn: ಇದು ಒಂದೇ ಸಲ ಆಯ್ತಾ ಅಥವಾ ತುಂಬಾ ಸಲ ಆಗಿದೆಯಾ?
          hi: क्या ऐसा एक बार हुआ या कई बार?
        proposition:
          satisfied: The respondent has threatened the speaker many times.
          contradicted: It happened only once.
        satisfied:
          en: "{RESP} has threatened me like this many times."
          kn: "{RESP} ಹೀಗೆ ತುಂಬಾ ಸಲ ಬೆದರಿಸಿದ್ದಾರೆ."
          kn-en_latn: "{RESP} heege tumba sala bedarisiddare."
          kn-en_mixed: "{RESP} ಹೀಗೆ many times threat ಮಾಡಿದ್ದಾರೆ."
          hi: "{RESP.erg} ऐसी धमकी कई बार दी है।"
          hi-en_latn: "{RESP.erg} aisi dhamki kai baar di hai."
        contradicted:
          en: This happened only once.
          kn: ಇದು ಒಂದೇ ಸಲ ಆಗಿದ್ದು.
          kn-en_latn: Idu onde sala aagiddu.
          kn-en_mixed: ಇದು just ಒಂದೇ ಸಲ ಆಗಿದ್ದು.
          hi: ऐसा सिर्फ़ एक बार हुआ है।
          hi-en_latn: Aisa sirf ek baar hua hai.
      - *complaint_filed
    evidence:
      - evidence_id: recording
        evidence_type: call_recording
        supports: [threat_made]
        held:
          en: I have a [recording](EVD) of what {RESP.pron} said.
          kn: "{RESP} ಹೇಳಿದ್ದರ [ರೆಕಾರ್ಡಿಂಗ್](EVD) ನನ್ನ ಹತ್ತಿರ ಇದೆ."
          kn-en_latn: "{RESP} heliddara [recording](EVD) nanna hatra ide."
          kn-en_mixed: "{RESP} ಹೇಳಿದ್ದರ [recording](EVD) ನನ್ನ ಹತ್ತಿರ ಇದೆ."
          hi: "{RESP.erg} जो कहा उसकी [रिकॉर्डिंग](EVD) मेरे पास है।"
          hi-en_latn: "{RESP.erg} jo kaha uski [recording](EVD) mere paas hai."
        missing:
          en: I could [not](NEG) record anything, so I have [no](NEG) [recording](EVD).
          kn: ನಾನು ಏನೂ [ರೆಕಾರ್ಡ್ ಮಾಡಲಿಲ್ಲ](NEG), ಹಾಗಾಗಿ [ರೆಕಾರ್ಡಿಂಗ್](EVD) [ಇಲ್ಲ](NEG).
          kn-en_latn: Naanu enu [record maadalilla](NEG), haagaagi [recording](EVD) [illa](NEG).
          kn-en_mixed: ನಾನು ಏನೂ [record ಮಾಡಲಿಲ್ಲ](NEG), so [recording](EVD) [ಇಲ್ಲ](NEG).
          hi: मैं कुछ रिकॉर्ड [नहीं](NEG) कर {g:SPK|m:पाया|f:पाई}, इसलिए [रिकॉर्डिंग](EVD) [नहीं](NEG) है।
          hi-en_latn: Main kuch record [nahi](NEG) kar {g:SPK|m:paaya|f:paayi}, isliye [recording](EVD) [nahi](NEG) hai.
      - evidence_id: earwitness
        evidence_type: witness
        supports: [threat_made]
        held:
          en: "[A man at the tea stall](EVD) heard everything."
          kn: "[ಟೀ ಅಂಗಡಿಯ ಒಬ್ಬರು](EVD) ಎಲ್ಲಾ ಕೇಳಿಸಿಕೊಂಡಿದ್ದಾರೆ."
          kn-en_latn: "[Tea angadiya obbru](EVD) ella kelisikondiddare."
          kn-en_mixed: "[Tea shop ಅವರು ಒಬ್ಬರು](EVD) ಎಲ್ಲಾ ಕೇಳಿಸಿಕೊಂಡಿದ್ದಾರೆ."
          hi: "[चाय की दुकान पर एक आदमी](EVD) ने सब सुना।"
          hi-en_latn: "[Chai ki dukaan par ek aadmi](EVD) ne sab suna."
        missing: *no_witness
    risk_facts:
      - flag: threat_to_life
        template:
          en: "{RESP} said {RESP.pron} will stab me with a knife if I go to [the police](@POLICE)."
          kn: "[ಪೊಲೀಸರ](@POLICE) ಹತ್ತಿರ ಹೋದರೆ ಚಾಕು ಹಾಕ್ತೀನಿ ಅಂತ {RESP} ಹೇಳಿದ್ದಾರೆ."
          kn-en_latn: "[Police](@POLICE) hatra hodre chaaku haaktini antha {RESP} heliddare."
          kn-en_mixed: "[Police](@POLICE) ಹತ್ತಿರ ಹೋದ್ರೆ knife ಹಾಕ್ತೀನಿ ಅಂತ {RESP} ಹೇಳಿದ್ದಾರೆ."
          hi: "{RESP.erg} कहा है कि अगर मैं [पुलिस](@POLICE) के पास {g:SPK|m:गया|f:गई} तो चाकू मार {g:RESP|m:देंगे|f:देंगी|n:देंगे}।"
          hi-en_latn: "{RESP.erg} kaha hai ki agar main [police](@POLICE) ke paas {g:SPK|m:gaya|f:gayi} to chaaku maar {g:RESP|m:denge|f:dengi|n:denge}."
    routing_variables:
      - {name: law_regime, values: [old, new], description: "incident before / on-or-after 2024-07-01"}
    candidate_provisions:
      - {provision_id: "BNS:351(2)", when: {law_regime: [new]}, title_hint: Criminal intimidation (punishment)}
      - {provision_id: "BNS:351(3)", when: {law_regime: [new], risk: [threat_to_life]}, title_hint: Threat to cause death or grievous hurt}
      - {provision_id: "BNSS:174", when: {law_regime: [new]}, title_hint: Information as to non-cognizable cases, note: cognizability depends on the limb; verify}
      - {provision_id: "IPC:506", when: {law_regime: [old]}, title_hint: Punishment for criminal intimidation}
      - {provision_id: "CrPC:155", when: {law_regime: [old]}, title_hint: Information as to non-cognizable cases}
    limitation_notes: Limitation for cognizance depends on the punishment for the limb charged. TO_VERIFY.
    confusable_with: [crim.hurt_assault, cyb.cyberstalking, fin.loan_recovery_harassment]
    co_occurs_with: [crim.hurt_assault, crim.police_refusal_fir]

  # ---------------------------------------------------------------- theft
  - issue_id: crim.theft
    domain: criminal
    title: {en: Theft, kn: ಕಳ್ಳತನ, hi: चोरी}
    plain_summary:
      en: Someone dishonestly took your movable property without your consent.
      kn: ನಿಮ್ಮ ಒಪ್ಪಿಗೆ ಇಲ್ಲದೆ ಯಾರೋ ಅಪ್ರಾಮಾಣಿಕವಾಗಿ ನಿಮ್ಮ ಚರ ಆಸ್ತಿಯನ್ನು ತೆಗೆದುಕೊಂಡಿದ್ದಾರೆ.
      hi: किसी ने आपकी सहमति के बिना बेईमानी से आपकी चल संपत्ति ले ली।
    risk_level: medium
    default_triage: self_help
    cast:
      - {slot: RESP, role: respondent, nouns: [unknown_person], named: false}
      - *police_slot
    value_slots: {ITEM: [gold_chain, mobile_phone, bike], PLACE: [market, bus_stand, temple], AMOUNT: [small, medium]}
    setup:
      en: I need help regarding {ITEM}.
      kn: "{ITEM} ಬಗ್ಗೆ ನಿಮ್ಮ ಸಹಾಯ ಬೇಕು."
      kn-en_latn: "{ITEM} bagge nimma sahaaya beku."
      kn-en_mixed: "{ITEM} ಬಗ್ಗೆ ನಿಮ್ಮ help ಬೇಕು."
      hi: "{ITEM.obl} के बारे में मुझे मदद चाहिए।"
      hi-en_latn: "{ITEM.obl} ke baare mein mujhe help chahiye."
    elements:
      - element_id: property_taken
        critical: true
        order: 1
        date_slot_required: true
        description: Movable property of the user was taken / moved out of the user's possession.
        event_type: theft
        args: {RESP: agent, ITEM: patient, PLACE: place}
        question:
          en: Are you sure the item was taken by someone, and not misplaced?
          kn: ಆ ವಸ್ತುವನ್ನು ಯಾರೋ ತಗೊಂಡು ಹೋದರು ಅಂತ ಖಚಿತವಾಗಿ ಗೊತ್ತಾ, ಎಲ್ಲೋ ಇಟ್ಟು ಮರೆತಿಲ್ಲ ತಾನೇ?
          hi: क्या आपको पक्का पता है कि सामान किसी ने लिया है, कहीं रखकर भूले तो नहीं?
        proposition:
          satisfied: Someone took the speaker's item.
          contradicted: The item was found at home; it was not stolen.
        satisfied:
          en: "{RESP} [stole](TRIG) {ITEM} near {PLACE} {DATE}."
          kn: "{DATE} {PLACE} ಹತ್ತಿರ {RESP} {ITEM} [ಕದ್ದುಬಿಟ್ಟರು](TRIG)."
          kn-en_latn: "{DATE} {PLACE} hatra {RESP} {ITEM} [kaddbittru](TRIG)."
          kn-en_mixed: "{DATE} {PLACE} ಹತ್ತಿರ {RESP} {ITEM} [steal ಮಾಡಿದ್ರು](TRIG)."
          hi: "{DATE} {PLACE.obl} के पास {RESP.erg} {ITEM} {g:ITEM|m:[चुरा लिया](TRIG)|f:[चुरा ली](TRIG)}।"
          hi-en_latn: "{DATE} {PLACE.obl} ke paas {RESP.erg} {ITEM} {g:ITEM|m:[chura liya](TRIG)|f:[chura li](TRIG)}."
        contradicted:
          en: "Later I found {ITEM} at home, so it was [not](NEG) [stolen](TRIG) after all."
          kn: "ಆಮೇಲೆ {ITEM} ಮನೆಯಲ್ಲೇ ಸಿಕ್ತು, ಅದನ್ನು ಯಾರೂ [ಕದ್ದಿರಲಿಲ್ಲ](TRIG,NEG)."
          kn-en_latn: "Aamele {ITEM} maneyalle siktu, adanna yaaru [kaddiralilla](TRIG,NEG)."
          kn-en_mixed: "ಆಮೇಲೆ {ITEM} ಮನೆಯಲ್ಲೇ ಸಿಕ್ತು, ಅದನ್ನು ಯಾರೂ [steal ಮಾಡಿರಲಿಲ್ಲ](TRIG,NEG)."
          hi: "बाद में {ITEM} घर पर ही मिल {g:ITEM|m:गया|f:गई}, उसकी [चोरी](TRIG) [नहीं](NEG) हुई थी।"
          hi-en_latn: "Baad mein {ITEM} ghar par hi mil {g:ITEM|m:gaya|f:gayi}, uski [chori](TRIG) [nahi](NEG) hui thi."
      - element_id: without_consent
        critical: true
        order: 1
        description: The property was taken without the user's consent.
        question:
          en: Did you give anyone permission to take or use it?
          kn: ಅದನ್ನು ತಗೊಳ್ಳೋಕೆ ಅಥವಾ ಬಳಸೋಕೆ ಯಾರಿಗಾದರೂ ಅನುಮತಿ ಕೊಟ್ಟಿದ್ರಾ?
          hi: क्या आपने किसी को उसे लेने या इस्तेमाल करने की इजाज़त दी थी?
        proposition:
          satisfied: The speaker never allowed anyone to take the item.
          contradicted: The speaker had lent the item to the respondent.
        satisfied:
          en: I [never](NEG) allowed anyone to take {ITEM}.
          kn: "{ITEM} ತಗೊಳ್ಳೋಕೆ ನಾನು ಯಾರಿಗೂ [ಬಿಟ್ಟಿರಲಿಲ್ಲ](NEG)."
          kn-en_latn: "{ITEM} tagolloke naanu yaarigu [bittiralilla](NEG)."
          kn-en_mixed: "{ITEM} ತಗೊಳ್ಳೋಕೆ ನಾನು ಯಾರಿಗೂ permission [ಕೊಟ್ಟಿರಲಿಲ್ಲ](NEG)."
          hi: "मैंने किसी को भी {ITEM} लेने की इजाज़त [नहीं](NEG) दी थी।"
          hi-en_latn: "Maine kisi ko bhi {ITEM} lene ki permission [nahi](NEG) di thi."
        contradicted:
          en: "I had lent {ITEM} to {RESP.dat} myself."
          kn: "{ITEM} ನಾನೇ {RESP.dat} ಕೊಟ್ಟಿದ್ದೆ."
          kn-en_latn: "{ITEM} naane {RESP.dat} kottidde."
          kn-en_mixed: "{ITEM} ನಾನೇ {RESP.dat} ಕೊಟ್ಟಿದ್ದೆ."
          hi: "{ITEM} मैंने खुद {RESP.dat} {g:ITEM|m:दिया था|f:दी थी}।"
          hi-en_latn: "{ITEM} maine khud {RESP.dat} {g:ITEM|m:diya tha|f:di thi}."
      - element_id: dishonest_intention
        critical: true
        may_be_unknown: true
        order: 2
        description: The taker intended to keep the property / cause wrongful loss.
        question:
          en: Has the person returned it, or do they seem to want to keep it?
          kn: ಆ ವ್ಯಕ್ತಿ ಅದನ್ನು ವಾಪಸ್ ಕೊಟ್ಟರಾ, ಅಥವಾ ಇಟ್ಟುಕೊಳ್ಳೋ ಉದ್ದೇಶ ಇದೆಯಾ?
          hi: क्या उस व्यक्ति ने उसे लौटाया, या रखने का इरादा लगता है?
        proposition:
          satisfied: The taker kept the item and has not returned it.
          contradicted: The taker returned the item and apologised.
        satisfied:
          en: "{RESP} took it to keep it, and has [not](NEG) returned it."
          kn: "{RESP} ಅದನ್ನು ಇಟ್ಟುಕೊಳ್ಳೋಕೆ ತಗೊಂಡಿದ್ದಾರೆ, ಇನ್ನೂ [ವಾಪಸ್ ಕೊಟ್ಟಿಲ್ಲ](NEG)."
          kn-en_latn: "{RESP} adanna ittukolloke tagondiddare, innu [vaapas kottilla](NEG)."
          kn-en_mixed: "{RESP} ಅದನ್ನು keep ಮಾಡ್ಕೊಳ್ಳೋಕೆ ತಗೊಂಡಿದ್ದಾರೆ, ಇನ್ನೂ [return ಮಾಡಿಲ್ಲ](NEG)."
          hi: "{RESP.erg} उसे अपने पास रखने के लिए लिया है और अब तक [नहीं](NEG) लौटाया।"
          hi-en_latn: "{RESP.erg} use apne paas rakhne ke liye liya hai aur ab tak [nahi](NEG) lautaya."
        contradicted:
          en: "{RESP} later returned it and said sorry."
          kn: "{RESP} ಆಮೇಲೆ ವಾಪಸ್ ಕೊಟ್ಟು ಸಾರಿ ಕೇಳಿದರು."
          kn-en_latn: "{RESP} aamele vaapas kottu sorry kelidru."
          kn-en_mixed: "{RESP} ಆಮೇಲೆ return ಮಾಡಿ sorry ಕೇಳಿದ್ರು."
          hi: "{RESP.erg} बाद में सामान लौटा दिया और माफ़ी माँगी।"
          hi-en_latn: "{RESP.erg} baad mein saamaan lauta diya aur sorry bola."
      - *complaint_filed
    evidence:
      - evidence_id: purchase_bill
        evidence_type: document
        supports: [property_taken]
        held:
          en: I still have the [purchase bill](EVD) for it.
          kn: ಅದರ [ಬಿಲ್](EVD) ಇನ್ನೂ ನನ್ನ ಹತ್ತಿರ ಇದೆ.
          kn-en_latn: Adara [bill](EVD) innu nanna hatra ide.
          kn-en_mixed: ಅದರ [bill](EVD) ಇನ್ನೂ ನನ್ನ ಹತ್ತಿರ ಇದೆ.
          hi: उसका [खरीद का बिल](EVD) अभी भी मेरे पास है।
          hi-en_latn: Uska [purchase bill](EVD) abhi bhi mere paas hai.
        missing:
          en: I do [not](NEG) have the [bill](EVD) anymore.
          kn: ಅದರ [ಬಿಲ್](EVD) ನನ್ನ ಹತ್ತಿರ [ಇಲ್ಲ](NEG).
          kn-en_latn: Adara [bill](EVD) nanna hatra [illa](NEG).
          kn-en_mixed: ಅದರ [bill](EVD) ನನ್ನ ಹತ್ತಿರ [ಇಲ್ಲ](NEG).
          hi: मेरे पास उसका [बिल](EVD) [नहीं](NEG) है।
          hi-en_latn: Mere paas uska [bill](EVD) [nahi](NEG) hai.
      - evidence_id: cctv
        evidence_type: photo_video
        supports: [property_taken]
        default_availability: obtainable
        held:
          en: The shop there has a [CCTV camera](EVD) facing the spot.
          kn: ಅಲ್ಲಿರೋ ಅಂಗಡಿಯಲ್ಲಿ [ಸಿಸಿಟಿವಿ ಕ್ಯಾಮೆರಾ](EVD) ಇದೆ.
          kn-en_latn: Alliro angadiyalli [CCTV camera](EVD) ide.
          kn-en_mixed: ಅಲ್ಲಿರೋ shop ಅಲ್ಲಿ [CCTV camera](EVD) ಇದೆ.
          hi: वहाँ की दुकान में [सीसीटीवी कैमरा](EVD) लगा है।
          hi-en_latn: Wahan ki dukaan mein [CCTV camera](EVD) laga hai.
        missing:
          en: There is [no](NEG) [CCTV camera](EVD) there.
          kn: ಅಲ್ಲಿ [ಸಿಸಿಟಿವಿ](EVD) [ಇಲ್ಲ](NEG).
          kn-en_latn: Alli [CCTV](EVD) [illa](NEG).
          kn-en_mixed: ಅಲ್ಲಿ [CCTV](EVD) [ಇಲ್ಲ](NEG).
          hi: वहाँ [कोई सीसीटीवी](EVD) [नहीं](NEG) है।
          hi-en_latn: Wahan [koi CCTV](EVD) [nahi](NEG) hai.
    risk_facts:
      - flag: imminent_violence
        template:
          en: "{RESP} saw me and said {RESP.pron} will come to our house [tonight](TIMEX:tonight)."
          kn: "{RESP} ನನ್ನನ್ನು ನೋಡಿ [ಇವತ್ತು ರಾತ್ರಿ](TIMEX:tonight) ನಮ್ಮ ಮನೆಗೆ ಬರ್ತೀನಿ ಅಂತ ಹೇಳಿದರು."
          kn-en_latn: "{RESP} nannanna nodi [ivattu raatri](TIMEX:tonight) namma mane ge bartini antha helidru."
          kn-en_mixed: "{RESP} ನನ್ನನ್ನು ನೋಡಿ [tonight](TIMEX:tonight) ನಮ್ಮ ಮನೆಗೆ ಬರ್ತೀನಿ ಅಂತ ಹೇಳಿದ್ರು."
          hi: "{RESP.erg} मुझे देखकर कहा कि [आज रात](TIMEX:tonight) हमारे घर {g:RESP|m:आएँगे|f:आएँगी|n:आएँगे}।"
          hi-en_latn: "{RESP.erg} mujhe dekhkar kaha ki [aaj raat](TIMEX:tonight) hamare ghar {g:RESP|m:aayenge|f:aayengi|n:aayenge}."
    routing_variables:
      - {name: law_regime, values: [old, new], description: "incident before / on-or-after 2024-07-01"}
    candidate_provisions:
      - {provision_id: "BNS:303(2)", when: {law_regime: [new]}, title_hint: Theft (punishment)}
      - {provision_id: "BNSS:173", when: {law_regime: [new]}, title_hint: Information in cognizable cases}
      - {provision_id: "IPC:379", when: {law_regime: [old]}, title_hint: Punishment for theft}
      - {provision_id: "CrPC:154", when: {law_regime: [old]}, title_hint: Information in cognizable cases}
    limitation_notes: Limitation for cognizance depends on maximum punishment. Report promptly; CCTV footage is often overwritten. TO_VERIFY.
    confusable_with: [crim.cheating]
    co_occurs_with: [crim.police_refusal_fir]

  # -------------------------------------------------------------- cheating
  - issue_id: crim.cheating
    domain: criminal
    title: {en: Cheating, kn: ವಂಚನೆ, hi: धोखाधड़ी}
    plain_summary:
      en: Someone deceived you with a false promise or statement and dishonestly made you hand over money or property.
      kn: ಯಾರೋ ಸುಳ್ಳು ಭರವಸೆ ಅಥವಾ ಮಾತಿನಿಂದ ಮೋಸ ಮಾಡಿ ಅಪ್ರಾಮಾಣಿಕವಾಗಿ ನಿಮ್ಮಿಂದ ದುಡ್ಡು ಅಥವಾ ಆಸ್ತಿ ಪಡೆದಿದ್ದಾರೆ.
      hi: किसी ने झूठे वादे या बात से आपको धोखा देकर बेईमानी से आपसे पैसा या संपत्ति ले ली।
    risk_level: medium
    default_triage: lawyer
    cast:
      - {slot: RESP, role: respondent, nouns: [acquaintance, friend, colleague]}
      - *police_slot
    value_slots: {AMOUNT: [medium, large]}
    setup:
      en: This is about money I gave to {RESP.dat}.
      kn: "ನಾನು {RESP.dat} ಕೊಟ್ಟ ದುಡ್ಡಿನ ಬಗ್ಗೆ ಇದು."
      kn-en_latn: "Naanu {RESP.dat} kotta duddina bagge idu."
      kn-en_mixed: "ನಾನು {RESP.dat} ಕೊಟ್ಟ money ಬಗ್ಗೆ ಇದು."
      hi: "यह उस पैसे के बारे में है जो मैंने {RESP.dat} दिया था।"
      hi-en_latn: "Yeh us paise ke baare mein hai jo maine {RESP.dat} diya tha."
    elements:
      - element_id: deception
        critical: true
        order: 1
        description: The respondent made a false promise or representation.
        event_type: false_promise
        args: {RESP: agent}
        question:
          en: What exactly did the person promise or tell you to get the money?
          kn: ದುಡ್ಡು ತಗೊಳ್ಳೋಕೆ ಆ ವ್ಯಕ್ತಿ ನಿಮಗೆ ಏನು ಹೇಳಿದರು ಅಥವಾ ಏನು ಮಾತು ಕೊಟ್ಟರು?
          hi: पैसे लेने के लिए उस व्यक्ति ने आपसे ठीक-ठीक क्या वादा किया या क्या कहा?
        proposition:
          satisfied: The respondent promised a job in exchange for money.
          contradicted: The respondent made no promise; it was a business deal that made a loss.
        satisfied:
          en: "{DATE} {RESP} [promised](TRIG) me a job in a big company if I paid some money."
          kn: "{DATE} {RESP} ದುಡ್ಡು ಕೊಟ್ರೆ ದೊಡ್ಡ ಕಂಪನಿಯಲ್ಲಿ ಕೆಲಸ ಕೊಡಿಸ್ತೀನಿ ಅಂತ [ಮಾತು ಕೊಟ್ಟರು](TRIG)."
          kn-en_latn: "{DATE} {RESP} duddu kotre dodda companyalli kelsa kodistini antha [maatu kottru](TRIG)."
          kn-en_mixed: "{DATE} {RESP} money ಕೊಟ್ರೆ big company ಅಲ್ಲಿ job ಕೊಡಿಸ್ತೀನಿ ಅಂತ [promise ಮಾಡಿದ್ರು](TRIG)."
          hi: "{DATE} {RESP.erg} [वादा किया](TRIG) कि पैसे देने पर मुझे बड़ी कंपनी में नौकरी दिलवा {g:RESP|m:देंगे|f:देंगी|n:देंगे}।"
          hi-en_latn: "{DATE} {RESP.erg} [promise kiya](TRIG) ki paise dene par mujhe badi company mein naukri dilwa {g:RESP|m:denge|f:dengi|n:denge}."
        contradicted:
          en: "{RESP} [never](NEG) [promised](TRIG) me anything; it was a business deal that went into loss."
          kn: "{RESP} ಏನೂ [ಮಾತು ಕೊಟ್ಟಿರಲಿಲ್ಲ](TRIG,NEG), ಅದು ಲಾಸ್ ಆದ ಬಿಸಿನೆಸ್ ಡೀಲ್ ಅಷ್ಟೇ."
          kn-en_latn: "{RESP} enu [maatu kottiralilla](TRIG,NEG), adu loss aada business deal ashte."
          kn-en_mixed: "{RESP} ಏನೂ [promise ಮಾಡಿರಲಿಲ್ಲ](TRIG,NEG), ಅದು loss ಆದ business deal ಅಷ್ಟೇ."
          hi: "{RESP.erg} कोई [वादा](TRIG) [नहीं](NEG) किया था, वो बस एक बिज़नेस डील थी जिसमें घाटा हो गया।"
          hi-en_latn: "{RESP.erg} koi [promise](TRIG) [nahi](NEG) kiya tha, woh bas ek business deal thi jismein loss ho gaya."
      - element_id: property_delivered
        critical: true
        order: 2
        date_slot_required: true
        description: Induced by the deception, the user handed over money or property.
        event_type: payment
        args: {RESP: recipient}
        question:
          en: Did you actually give money or anything valuable? How much, and how?
          kn: ನೀವು ನಿಜವಾಗಿ ದುಡ್ಡು ಅಥವಾ ಬೆಲೆಬಾಳುವ ವಸ್ತು ಕೊಟ್ಟಿರಾ? ಎಷ್ಟು, ಹೇಗೆ?
          hi: क्या आपने सच में पैसे या कोई कीमती चीज़ दी? कितने और कैसे?
        proposition:
          satisfied: Believing the respondent, the speaker paid the money.
          contradicted: The speaker had not paid any money.
        satisfied:
          en: "Believing {RESP.pron_acc}, I [paid](TRIG) {AMOUNT} {DATE}."
          kn: "{RESP.pron_gen} ಮಾತು ನಂಬಿ ನಾನು {DATE} {AMOUNT} [ಕೊಟ್ಟೆ](TRIG)."
          kn-en_latn: "{RESP.pron_gen} maatu nambi naanu {DATE} {AMOUNT} [kotte](TRIG)."
          kn-en_mixed: "{RESP.pron_gen} ಮಾತು ನಂಬಿ ನಾನು {DATE} {AMOUNT} [pay ಮಾಡಿದೆ](TRIG)."
          hi: "{RESP.pron_gen_f} बात पर भरोसा करके मैंने {DATE} {AMOUNT} [दे दिए](TRIG)।"
          hi-en_latn: "{RESP.pron_gen_f} baat par bharosa karke maine {DATE} {AMOUNT} [de diye](TRIG)."
        contradicted:
          en: I had [not](NEG) [paid](TRIG) any money yet.
          kn: ನಾನು ಇನ್ನೂ ಏನೂ [ದುಡ್ಡು ಕೊಟ್ಟಿರಲಿಲ್ಲ](TRIG,NEG).
          kn-en_latn: Naanu innu enu [duddu kottiralilla](TRIG,NEG).
          kn-en_mixed: ನಾನು ಇನ್ನೂ ಏನೂ [pay ಮಾಡಿರಲಿಲ್ಲ](TRIG,NEG).
          hi: मैंने अभी तक कोई [पैसा](TRIG) [नहीं](NEG) दिया था।
          hi-en_latn: Maine abhi tak koi [paisa](TRIG) [nahi](NEG) diya tha.
      - element_id: dishonest_intent
        critical: true
        may_be_unknown: true
        order: 3
        description: The respondent had no intention of keeping the promise (absconded, stopped responding).
        event_type: evasion
        args: {RESP: agent}
        question:
          en: After you paid, what did the person do? Did they avoid you or return anything?
          kn: ದುಡ್ಡು ಕೊಟ್ಟ ಮೇಲೆ ಆ ವ್ಯಕ್ತಿ ಏನು ಮಾಡಿದರು? ನಿಮ್ಮನ್ನು ತಪ್ಪಿಸಿಕೊಂಡರಾ ಅಥವಾ ಏನಾದರೂ ವಾಪಸ್ ಕೊಟ್ಟರಾ?
          hi: पैसे देने के बाद उस व्यक्ति ने क्या किया? क्या वो आपसे बचने लगे या कुछ लौटाया?
        proposition:
          satisfied: After taking the money the respondent stopped answering calls and gave no job.
          contradicted: The respondent is still in touch and has returned part of the money.
        satisfied:
          en: "After taking the money, {RESP} [stopped answering](TRIG) my calls and there was [no](NEG) job."
          kn: "ದುಡ್ಡು ತಗೊಂಡ ಮೇಲೆ {RESP} ನನ್ನ ಫೋನ್ [ಎತ್ತೋದನ್ನೇ ಬಿಟ್ಟರು](TRIG), ಕೆಲಸನೂ [ಸಿಗಲಿಲ್ಲ](NEG)."
          kn-en_latn: "Duddu tagonda mele {RESP} nanna phone [ettodanne bittru](TRIG), kelsanu [siglilla](NEG)."
          kn-en_mixed: "Money ತಗೊಂಡ ಮೇಲೆ {RESP} ನನ್ನ calls [attend ಮಾಡೋದನ್ನೇ ಬಿಟ್ಟರು](TRIG), job ಉ [ಸಿಗಲಿಲ್ಲ](NEG)."
          hi: "पैसे लेने के बाद {RESP.erg} मेरा फ़ोन [उठाना बंद कर दिया](TRIG) और नौकरी भी [नहीं](NEG) मिली।"
          hi-en_latn: "Paise lene ke baad {RESP.erg} mera phone [uthana band kar diya](TRIG) aur naukri bhi [nahi](NEG) mili."
        contradicted:
          en: "{RESP} is still in touch and has [returned](TRIG) part of the money."
          kn: "{RESP} ಇನ್ನೂ ಸಂಪರ್ಕದಲ್ಲಿದ್ದಾರೆ, ಸ್ವಲ್ಪ ದುಡ್ಡು [ವಾಪಸ್ ಕೊಟ್ಟಿದ್ದಾರೆ](TRIG)."
          kn-en_latn: "{RESP} innu contact alli iddare, swalpa duddu [vaapas kottiddare](TRIG)."
          kn-en_mixed: "{RESP} ಇನ್ನೂ contact ಅಲ್ಲಿ ಇದ್ದಾರೆ, ಸ್ವಲ್ಪ money [return ಮಾಡಿದ್ದಾರೆ](TRIG)."
          hi: "{RESP} अब भी संपर्क में हैं और कुछ पैसे {g:RESP|m:[लौटा चुके](TRIG)|f:[लौटा चुकी](TRIG)|n:[लौटा चुके](TRIG)} हैं।"
          hi-en_latn: "{RESP} ab bhi contact mein hain aur kuch paise {g:RESP|m:[lauta chuke](TRIG)|f:[lauta chuki](TRIG)|n:[lauta chuke](TRIG)} hain."
      - *complaint_filed
    evidence:
      - evidence_id: payment_record
        evidence_type: digital_record
        supports: [property_delivered]
        held:
          en: I paid through UPI, so I have the [transaction details](EVD).
          kn: ನಾನು ಯುಪಿಐ ಮೂಲಕ ಕೊಟ್ಟಿದ್ದು, [ಟ್ರಾನ್ಸಾಕ್ಷನ್ ಡೀಟೇಲ್ಸ್](EVD) ಇದೆ.
          kn-en_latn: Naanu UPI moolaka kottiddu, [transaction details](EVD) ide.
          kn-en_mixed: ನಾನು UPI ಮೂಲಕ pay ಮಾಡಿದ್ದು, [transaction details](EVD) ಇದೆ.
          hi: मैंने यूपीआई से पैसे दिए थे, तो [ट्रांज़ैक्शन की डिटेल](EVD) मेरे पास है।
          hi-en_latn: Maine UPI se paise diye the, to [transaction details](EVD) mere paas hain.
        missing:
          en: I paid in cash, and I have [no](NEG) [receipt](EVD).
          kn: ನಾನು ಕ್ಯಾಶ್ ಕೊಟ್ಟೆ, [ರಸೀದಿ](EVD) ಏನೂ [ಇಲ್ಲ](NEG).
          kn-en_latn: Naanu cash kotte, [receipt](EVD) enu [illa](NEG).
          kn-en_mixed: ನಾನು cash ಕೊಟ್ಟೆ, [receipt](EVD) ಏನೂ [ಇಲ್ಲ](NEG).
          hi: मैंने कैश दिया था, कोई [रसीद](EVD) [नहीं](NEG) है।
          hi-en_latn: Maine cash diya tha, koi [receipt](EVD) [nahi](NEG) hai.
      - evidence_id: chats
        evidence_type: chat_message
        supports: [deception]
        held:
          en: I have the [WhatsApp chats](EVD) where {RESP.pron} promised the job.
          kn: "{RESP.pron} ಕೆಲಸ ಕೊಡಿಸ್ತೀನಿ ಅಂತ ಹೇಳಿದ [ವಾಟ್ಸಾಪ್ ಚಾಟ್](EVD) ನನ್ನ ಹತ್ತಿರ ಇದೆ."
          kn-en_latn: "{RESP.pron} kelsa kodistini antha helida [WhatsApp chat](EVD) nanna hatra ide."
          kn-en_mixed: "{RESP.pron} job ಕೊಡಿಸ್ತೀನಿ ಅಂತ ಹೇಳಿದ [WhatsApp chat](EVD) ನನ್ನ ಹತ್ತಿರ ಇದೆ."
          hi: "मेरे पास वो [व्हाट्सऐप चैट](EVD) है जिसमें {RESP.pron_erg} नौकरी का वादा किया था।"
          hi-en_latn: "Mere paas woh [WhatsApp chat](EVD) hai jismein {RESP.pron_erg} naukri ka promise kiya tha."
        missing:
          en: Everything was said over phone calls, there are [no](NEG) [messages](EVD).
          kn: ಎಲ್ಲಾ ಫೋನ್‌ನಲ್ಲೇ ಮಾತಾಡಿದ್ದು, [ಮೆಸೇಜ್](EVD) ಏನೂ [ಇಲ್ಲ](NEG).
          kn-en_latn: Ella phone alle maataadiddu, [message](EVD) enu [illa](NEG).
          kn-en_mixed: ಎಲ್ಲಾ phone ಅಲ್ಲೇ ಮಾತಾಡಿದ್ದು, [messages](EVD) ಏನೂ [ಇಲ್ಲ](NEG).
          hi: सारी बात फ़ोन पर हुई थी, कोई [मैसेज](EVD) [नहीं](NEG) है।
          hi-en_latn: Saari baat phone par hui thi, koi [message](EVD) [nahi](NEG) hai.
    risk_facts:
      - flag: self_harm
        template:
          en: I borrowed this money from others, and I feel there is [no](NEG) point in living.
          kn: ಈ ದುಡ್ಡು ಬೇರೆಯವರಿಂದ ಸಾಲ ತಗೊಂಡಿದ್ದೆ, ಬದುಕೋದೇ [ಬೇಡ](NEG) ಅನ್ನಿಸ್ತಿದೆ.
          kn-en_latn: Ee duddu bereyavrinda saala tagondidde, badukode [beda](NEG) annistide.
          kn-en_mixed: ಈ money ಬೇರೆಯವರಿಂದ loan ತಗೊಂಡಿದ್ದೆ, ಬದುಕೋದೇ [ಬೇಡ](NEG) ಅನ್ನಿಸ್ತಿದೆ.
          hi: यह पैसा मैंने उधार लिया था, अब जीने का मन [नहीं](NEG) करता।
          hi-en_latn: Yeh paisa maine udhaar liya tha, ab jeene ka mann [nahi](NEG) karta.
    routing_variables:
      - {name: law_regime, values: [old, new], description: "incident before / on-or-after 2024-07-01"}
    candidate_provisions:
      - {provision_id: "BNS:318(4)", when: {law_regime: [new]}, title_hint: Cheating and dishonestly inducing delivery of property}
      - {provision_id: "BNSS:173", when: {law_regime: [new]}, title_hint: Information in cognizable cases}
      - {provision_id: "IPC:420", when: {law_regime: [old]}, title_hint: Cheating and dishonestly inducing delivery of property}
      - {provision_id: "CrPC:154", when: {law_regime: [old]}, title_hint: Information in cognizable cases}
    limitation_notes: Criminal limitation depends on punishment; a civil suit for recovery of money is generally governed by the Limitation Act (verify article). TO_VERIFY.
    confusable_with: [crim.theft, cyb.upi_payment_fraud, cyb.impersonation]
    co_occurs_with: [crim.police_refusal_fir, cyb.impersonation]

  # ------------------------------------------------------ police refusal
  - issue_id: crim.police_refusal_fir
    domain: criminal
    title: {en: Police refusing to register a complaint, kn: ಪೊಲೀಸರು ದೂರು ದಾಖಲಿಸಲು ನಿರಾಕರಣೆ, hi: पुलिस का शिकायत दर्ज करने से इनकार}
    plain_summary:
      en: You reported a cognizable crime but the police refused to register it.
      kn: ನೀವು ಗಂಭೀರ (ಕಾಗ್ನಿಜಬಲ್) ಅಪರಾಧದ ಬಗ್ಗೆ ತಿಳಿಸಿದರೂ ಪೊಲೀಸರು ಅದನ್ನು ದಾಖಲಿಸಲು ನಿರಾಕರಿಸಿದ್ದಾರೆ.
      hi: आपने संज्ञेय अपराध की सूचना दी लेकिन पुलिस ने उसे दर्ज करने से मना कर दिया।
    risk_level: medium
    default_triage: lawyer
    cast:
      - {slot: RESP, role: respondent, nouns: [neighbour, acquaintance]}
      - *police_slot
      - {slot: SPO, kind: organization, role: organization, nouns: [police], named: false}
    setup:
      en: My problem is with [the local police station](@POLICE).
      kn: ನನ್ನ ಸಮಸ್ಯೆ ನಮ್ಮ ಏರಿಯಾದ [ಪೊಲೀಸ್ ಠಾಣೆಯ](@POLICE) ಬಗ್ಗೆ.
      kn-en_latn: Nanna samasye namma areada [police station](@POLICE) bagge.
      kn-en_mixed: ನನ್ನ problem ನಮ್ಮ area ದ [police station](@POLICE) ಬಗ್ಗೆ.
      hi: मेरी परेशानी हमारे इलाके के [पुलिस स्टेशन](@POLICE) को लेकर है।
      hi-en_latn: Meri problem hamare area ke [police station](@POLICE) ko lekar hai.
    elements:
      - element_id: cognizable_offence_reported
        critical: true
        order: 1
        date_slot_required: true
        description: The user approached the police with information about a cognizable offence.
        event_type: approach_police
        args: {POLICE: recipient}
        question:
          en: What did you go to the police to report? Was it a crime like theft, assault or a threat?
          kn: ನೀವು ಪೊಲೀಸರಿಗೆ ಏನು ದೂರು ಕೊಡೋಕೆ ಹೋಗಿದ್ರಿ? ಕಳ್ಳತನ, ಹಲ್ಲೆ, ಬೆದರಿಕೆ ತರಹದ ಅಪರಾಧನಾ?
          hi: आप पुलिस को क्या बताने गए थे? क्या वो चोरी, मारपीट या धमकी जैसा अपराध था?
        proposition:
          satisfied: The speaker went to the police to report a break-in and theft by the respondent.
          contradicted: The speaker went to the police only about a small civil money dispute.
        satisfied:
          en: "{DATE} I [went](TRIG) to [the police station](@POLICE) to complain that {RESP} broke into our house and took our things."
          kn: "{DATE} {RESP} ನಮ್ಮ ಮನೆಗೆ ನುಗ್ಗಿ ವಸ್ತುಗಳನ್ನು ತಗೊಂಡು ಹೋದರು ಅಂತ ದೂರು ಕೊಡೋಕೆ [ಪೊಲೀಸ್ ಠಾಣೆಗೆ](@POLICE) [ಹೋದೆ](TRIG)."
          kn-en_latn: "{DATE} {RESP} namma mane ge nuggi vastugalanna tagondu hodru antha complaint kodoke [police station](@POLICE) ge [hode](TRIG)."
          kn-en_mixed: "{DATE} {RESP} ನಮ್ಮ ಮನೆಗೆ ನುಗ್ಗಿ things ತಗೊಂಡು ಹೋದ್ರು ಅಂತ complaint ಕೊಡೋಕೆ [police station](@POLICE) ಗೆ [ಹೋದೆ](TRIG)."
          hi: "{DATE} मैं यह शिकायत करने [पुलिस स्टेशन](@POLICE) {g:SPK|m:[गया](TRIG)|f:[गई](TRIG)} कि {RESP.erg} घर में घुसकर सामान चुराया।"
          hi-en_latn: "{DATE} main yeh complaint karne [police station](@POLICE) {g:SPK|m:[gaya](TRIG)|f:[gayi](TRIG)} ki {RESP.erg} ghar mein ghuskar saamaan churaya."
        contradicted:
          en: "{DATE} I [went](TRIG) to [the police station](@POLICE) only about a small money dispute with {RESP.acc}, [nothing](NEG) criminal."
          kn: "{DATE} {RESP.gen} ಜೊತೆ ಇರೋ ಸಣ್ಣ ದುಡ್ಡಿನ ವ್ಯವಹಾರದ ಬಗ್ಗೆ ಮಾತ್ರ [ಪೊಲೀಸ್ ಠಾಣೆಗೆ](@POLICE) [ಹೋಗಿದ್ದೆ](TRIG), ಕ್ರಿಮಿನಲ್ ಏನೂ [ಇಲ್ಲ](NEG)."
          kn-en_latn: "{DATE} {RESP.gen} jote iro sanna duddina vyavahaarada bagge maatra [police station](@POLICE) ge [hogidde](TRIG), criminal enu [illa](NEG)."
          kn-en_mixed: "{DATE} {RESP.gen} ಜೊತೆ ಇರೋ small money matter ಬಗ್ಗೆ ಮಾತ್ರ [police station](@POLICE) ಗೆ [ಹೋಗಿದ್ದೆ](TRIG), criminal ಏನೂ [ಇಲ್ಲ](NEG)."
          hi: "{DATE} मैं {RESP.gen_pl} साथ छोटे से पैसों के लेन-देन के बारे में ही [पुलिस स्टेशन](@POLICE) {g:SPK|m:[गया था](TRIG)|f:[गई थी](TRIG)}, कोई अपराध वाली बात [नहीं](NEG) थी।"
          hi-en_latn: "{DATE} main {RESP.gen_pl} saath chhote se paison ke len-den ke baare mein hi [police station](@POLICE) {g:SPK|m:[gaya tha](TRIG)|f:[gayi thi](TRIG)}, koi crime wali baat [nahi](NEG) thi."
      - element_id: refusal_to_register
        critical: true
        may_be_unknown: true
        order: 2
        description: The police refused to register the information / complaint.
        event_type: refusal
        args: {POLICE: agent}
        question:
          en: What did the police do when you went? Did they refuse to register the complaint?
          kn: ನೀವು ಹೋದಾಗ ಪೊಲೀಸರು ಏನು ಮಾಡಿದರು? ದೂರು ದಾಖಲಿಸಿಕೊಳ್ಳೋಕೆ ನಿರಾಕರಿಸಿದರಾ?
          hi: जब आप गए तो पुलिस ने क्या किया? क्या उन्होंने शिकायत दर्ज करने से मना किया?
        proposition:
          satisfied: The police refused to write the complaint and sent the speaker away.
          contradicted: The police registered the complaint and gave a copy.
        satisfied:
          en: But [the police](@POLICE) [refused](TRIG) to write my complaint and sent me away.
          kn: ಆದರೆ [ಪೊಲೀಸರು](@POLICE) ನನ್ನ ದೂರು ಬರೆದುಕೊಳ್ಳೋಕೆ [ನಿರಾಕರಿಸಿದರು](TRIG), ವಾಪಸ್ ಕಳಿಸಿದರು.
          kn-en_latn: Aadre [police](@POLICE) nanna complaint bardukolloke [refuse maadidru](TRIG), vaapas kalisidru.
          kn-en_mixed: ಆದ್ರೆ [police](@POLICE) ನನ್ನ complaint ಬರೆದುಕೊಳ್ಳೋಕೆ [refuse ಮಾಡಿದ್ರು](TRIG), ವಾಪಸ್ ಕಳಿಸಿದ್ರು.
          hi: लेकिन [पुलिस](@POLICE) ने मेरी शिकायत लिखने से [मना कर दिया](TRIG) और मुझे वापस भेज दिया।
          hi-en_latn: Lekin [police](@POLICE) ne meri complaint likhne se [mana kar diya](TRIG) aur mujhe waapas bhej diya.
        contradicted:
          en: "[The police](@POLICE) [registered](TRIG) my complaint and gave me a copy."
          kn: "[ಪೊಲೀಸರು](@POLICE) ನನ್ನ ದೂರು [ದಾಖಲಿಸಿಕೊಂಡು](TRIG) ಕಾಪಿ ಕೊಟ್ಟರು."
          kn-en_latn: "[Police](@POLICE) nanna complaint [register maadi](TRIG) copy kottru."
          kn-en_mixed: "[Police](@POLICE) ನನ್ನ complaint [register ಮಾಡಿ](TRIG) copy ಕೊಟ್ರು."
          hi: "[पुलिस](@POLICE) ने मेरी शिकायत [दर्ज की](TRIG) और कॉपी भी दी।"
          hi-en_latn: "[Police](@POLICE) ne meri complaint [darj ki](TRIG) aur copy bhi di."
      - element_id: escalated_to_sp
        critical: false
        order: 3
        description: The user sent the complaint in writing to the Superintendent of Police.
        event_type: written_complaint
        args: {SPO: recipient}
        question:
          en: Have you sent a written complaint to the Superintendent of Police, or approached the Magistrate?
          kn: ಎಸ್‌ಪಿ ಅವರಿಗೆ ಲಿಖಿತ ದೂರು ಕಳಿಸಿದ್ದೀರಾ ಅಥವಾ ಮ್ಯಾಜಿಸ್ಟ್ರೇಟ್ ಹತ್ತಿರ ಹೋಗಿದ್ದೀರಾ?
          hi: क्या आपने एसपी को लिखित शिकायत भेजी है या मजिस्ट्रेट के पास गए हैं?
        proposition:
          satisfied: The speaker sent a written complaint to the SP office.
          contradicted: The speaker has not written to any senior officer.
        satisfied:
          en: After that I [sent](TRIG) a written complaint by post to [the SP office](@SPO).
          kn: ಅದಾದ ಮೇಲೆ ನಾನು [ಎಸ್‌ಪಿ ಆಫೀಸ್‌ಗೆ](@SPO) ಪೋಸ್ಟ್ ಮೂಲಕ ಲಿಖಿತ ದೂರು [ಕಳಿಸಿದೆ](TRIG).
          kn-en_latn: Adaada mele naanu [SP office](@SPO) ge post moolaka written complaint [kaliside](TRIG).
          kn-en_mixed: ಅದಾದ ಮೇಲೆ ನಾನು [SP office](@SPO) ಗೆ post ಮೂಲಕ written complaint [ಕಳಿಸಿದೆ](TRIG).
          hi: उसके बाद मैंने [एसपी ऑफ़िस](@SPO) को डाक से लिखित शिकायत [भेजी](TRIG)।
          hi-en_latn: Uske baad maine [SP office](@SPO) ko post se written complaint [bheji](TRIG).
        contradicted:
          en: I have [not](NEG) [written](TRIG) to any senior officer yet.
          kn: ನಾನು ಇನ್ನೂ ಯಾವ ಮೇಲಧಿಕಾರಿಗೂ [ಬರೆದಿಲ್ಲ](TRIG,NEG).
          kn-en_latn: Naanu innu yaava senior officer gu [bardilla](TRIG,NEG).
          kn-en_mixed: ನಾನು ಇನ್ನೂ ಯಾವ senior officer ಗೂ [ಬರೆದಿಲ್ಲ](TRIG,NEG).
          hi: मैंने अभी तक किसी बड़े अधिकारी को [नहीं](NEG) [लिखा](TRIG) है।
          hi-en_latn: Maine abhi tak kisi senior officer ko [nahi](NEG) [likha](TRIG) hai.
    evidence:
      - evidence_id: complaint_copy
        evidence_type: official_receipt
        supports: [cognizable_offence_reported]
        held:
          en: I have a [copy of my written complaint](EVD) with the station seal.
          kn: ಠಾಣೆಯ ಸೀಲ್ ಇರೋ [ನನ್ನ ದೂರಿನ ಕಾಪಿ](EVD) ನನ್ನ ಹತ್ತಿರ ಇದೆ.
          kn-en_latn: Station seal iro [nanna complaint copy](EVD) nanna hatra ide.
          kn-en_mixed: Station seal ಇರೋ [ನನ್ನ complaint copy](EVD) ನನ್ನ ಹತ್ತಿರ ಇದೆ.
          hi: मेरे पास थाने की मुहर वाली [शिकायत की कॉपी](EVD) है।
          hi-en_latn: Mere paas thane ki stamp wali [complaint ki copy](EVD) hai.
        missing:
          en: "[They](@POLICE:pron) did [not](NEG) give me [any acknowledgement](EVD)."
          kn: "[ಅವರು](@POLICE:pron) ಯಾವ [ರಸೀದಿಯೂ](EVD) [ಕೊಡಲಿಲ್ಲ](NEG)."
          kn-en_latn: "[Avru](@POLICE:pron) yaava [acknowledgement](EVD) [kodalilla](NEG)."
          kn-en_mixed: "[ಅವರು](@POLICE:pron) ಯಾವ [acknowledgement](EVD) [ಕೊಡಲಿಲ್ಲ](NEG)."
          hi: "[उन्होंने](@POLICE:pron) कोई [पावती](EVD) [नहीं](NEG) दी।"
          hi-en_latn: "[Unhone](@POLICE:pron) koi [acknowledgement](EVD) [nahi](NEG) di."
    risk_facts:
      - flag: imminent_violence
        template:
          en: "{RESP} is roaming freely and has threatened to attack my family [tonight](TIMEX:tonight)."
          kn: "{RESP} ಆರಾಮಾಗಿ ಓಡಾಡ್ತಿದ್ದಾರೆ, [ಇವತ್ತು ರಾತ್ರಿ](TIMEX:tonight) ನಮ್ಮ ಮನೆಯವರ ಮೇಲೆ ಹಲ್ಲೆ ಮಾಡ್ತೀನಿ ಅಂತ ಬೆದರಿಸಿದ್ದಾರೆ."
          kn-en_latn: "{RESP} aaraamaagi odaadtiddare, [ivattu raatri](TIMEX:tonight) namma maneyavra mele halle maadtini antha bedarisiddare."
          kn-en_mixed: "{RESP} free ಆಗಿ ಓಡಾಡ್ತಿದ್ದಾರೆ, [tonight](TIMEX:tonight) ನಮ್ಮ family ಮೇಲೆ attack ಮಾಡ್ತೀನಿ ಅಂತ threat ಮಾಡಿದ್ದಾರೆ."
          hi: "{RESP} खुलेआम घूम {g:RESP|m:रहे|f:रही|n:रहे} हैं और {RESP.pron_erg} [आज रात](TIMEX:tonight) मेरे परिवार पर हमला करने की धमकी दी है।"
          hi-en_latn: "{RESP} khuleaam ghoom {g:RESP|m:rahe|f:rahi|n:rahe} hain aur {RESP.pron_erg} [aaj raat](TIMEX:tonight) mere parivaar par hamla karne ki dhamki di hai."
    routing_variables:
      - {name: law_regime, values: [old, new], description: "date the police were approached, before / on-or-after 2024-07-01"}
    candidate_provisions:
      - {provision_id: "BNSS:173", when: {law_regime: [new]}, title_hint: Information in cognizable cases, note: sub-section (4) on approaching the Superintendent of Police; verify}
      - {provision_id: "BNSS:175(3)", when: {law_regime: [new]}, title_hint: Magistrate may order investigation}
      - {provision_id: "CrPC:154", when: {law_regime: [old]}, title_hint: Information in cognizable cases, note: sub-section (3) on SP; verify}
      - {provision_id: "CrPC:156(3)", when: {law_regime: [old]}, title_hint: Magistrate may order investigation}
    limitation_notes: No fixed limitation for approaching the SP or Magistrate, but delay weakens the case; the underlying offence's limitation still applies. TO_VERIFY.
    confusable_with: [crim.theft, crim.hurt_assault]
    co_occurs_with: [crim.theft, crim.cheating, cyb.upi_payment_fraud]
