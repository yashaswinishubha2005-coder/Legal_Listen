          kn: ಎಲ್ಲಾ ಮುಖಾಮುಖಿ ಹೇಳಿದ್ದು, [ರೆಕಾರ್ಡಿಂಗ್](EVD) [ಇಲ್ಲ](NEG).
          kn-en_latn: Ella mukhaamukhi heliddu, [recording](EVD) [illa](NEG).
          kn-en_mixed: ಎಲ್ಲಾ face to face ಹೇಳಿದ್ದು, [recording](EVD) [ಇಲ್ಲ](NEG).
          hi: सब आमने-सामने कहा गया, कोई [रिकॉर्डिंग](EVD) [नहीं](NEG) है।
          hi-en_latn: Sab aamne-saamne kaha gaya, koi [recording](EVD) [nahi](NEG) hai.
