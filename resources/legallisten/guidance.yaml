    - [[took, paid, gave, ಕೊಟ್ಟೆ, ಕೊಟ್ಟಿದ್ದೆ, दिए, दिया, "le liye"], [promise, "job", "visa", "loan", "double", ಕೆಲಸ, ಮಾತು ಕೊಟ್ಟ, वादा, नौकरी, "naukri"], [money, rupees, lakh, ₹, ದುಡ್ಡು, ಹಣ, ರೂಪಾಯಿ, पैसे, रुपये, लाख, paise]]
  cyb.upi_payment_fraud:
