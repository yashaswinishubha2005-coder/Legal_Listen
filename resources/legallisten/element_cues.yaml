# How clients commonly state each legal element in their own words (offline understanding).
# sat: cues meaning the element IS met; con: cues meaning it is NOT met.
# A cue is a string (Latin: whole word; Kannada/Devanagari: start of a word, suffixes allowed)
# or a list of strings that must ALL appear in the same sentence.
# A sat cue in a sentence that also has a negation word (not, never, ಇಲ್ಲ, नहीं, nahi, illa …) counts as con,
# unless the cue itself already contains the negation. TO_VERIFY by native speakers.

